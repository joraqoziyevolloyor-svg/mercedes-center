<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>
<title>Daftar va Kassa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the shop's HR mini-app language — one 560px column, header with title + icons, hairline sections, bottom tabs */
:root{--bg:#ffffff;--ink:#111316;--muted:#5c6370;--line:#e3e5e8;--line-2:#111316;--accent:#1f5fa8;--accent-ink:#ffffff;--tile:#f6f7f8;
 --warn:#9a6200;--warn-bar:#c8860a;--warn-bg:#fbf3e3;--ok:#1e7a4f;--ok-bg:#e8f4ee;--no:#a3241c;--no-bg:#f9e9e7;--off:#c9cdd3;
 --pen-red:#e0362b;--pen-blue:#1f5fd6;--pen-hl:rgba(255,205,0,.45);
 --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--ink:#e8eaed;--muted:#9aa0a8;--line:#262a30;--line-2:#3a3f47;--accent:#7fb2e5;--accent-ink:#0e1013;--tile:#15181c;
 --warn:#e0a33a;--warn-bar:#e0a33a;--warn-bg:#2a2112;--ok:#3fb37f;--ok-bg:#12261c;--no:#ff8f86;--no-bg:#311513;--off:#4a4f57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--ink:#e8eaed;--muted:#9aa0a8;--line:#262a30;--line-2:#3a3f47;--accent:#7fb2e5;--accent-ink:#0e1013;--tile:#15181c;
 --warn:#e0a33a;--warn-bar:#e0a33a;--warn-bg:#2a2112;--ok:#3fb37f;--ok-bg:#12261c;--no:#ff8f86;--no-bg:#311513;--off:#4a4f57;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line-2);padding:16px 20px 12px;display:flex;gap:10px;align-items:flex-start}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.bar .tt{flex:1;min-width:0}
.bar .ws-name{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar h1{font-size:22px;font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
.bar .meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px}
.bar .meta .mono{color:var(--ink)}
.ib{width:38px;height:38px;border:1px solid transparent;background:none;border-radius:8px;display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none}
.ib:hover{border-color:var(--line)}
.ib.on{border-color:var(--accent);color:var(--accent)}
.ib svg{width:20px;height:20px}
.menu{position:absolute;right:56px;top:58px;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.14);overflow:hidden}
.menu button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;font-size:15px}
.menu button:first-child{border-top:0}
.menu button.on{color:var(--accent);font-weight:600}
.menu button:hover{background:var(--tile)}
.menu svg{width:18px;height:18px}
.theme .sun,.theme .moon{grid-area:1/1;display:grid;place-items:center;transition:opacity .2s,transform .3s}
.theme .moon{opacity:0;transform:rotate(-60deg) scale(.6)}
.theme.dark .sun{opacity:0;transform:rotate(60deg) scale(.6)}.theme.dark .moon{opacity:1;transform:none}
/* blocks */
.sample{margin:10px 20px 0;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:2px 8px;display:inline-block}
.status{display:flex;gap:10px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--line)}
.status .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.status b{font-weight:600}.status small{display:block;color:var(--muted);font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kpi div{padding:16px 8px 14px 20px;border-right:1px solid var(--line);min-width:0}
.kpi div:last-child{border-right:0}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:28px;line-height:1.05;white-space:nowrap}
.kpi b small{font-size:15px}
.kpi span{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.3}
.lbl2{padding:16px 20px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:baseline;gap:8px}
.lbl2 .grow{flex:1}.lbl2 .mono{letter-spacing:0}
.att{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;border-top:1px solid var(--line)}
.att:hover{background:var(--tile)}
.att .b4.on,.att.sel{background:var(--tile)}
.att .b4{width:4px;height:36px;border-radius:2px;flex:none;background:var(--off)}
.att .gr{flex:1;min-width:0}
.att .t1{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .am{font-family:var(--f-mono);font-size:15px;text-align:right;white-space:nowrap}
.att .ch{color:var(--muted)}
.b-no{background:var(--no)!important}.b-warn{background:var(--warn-bar)!important}.b-ok{background:var(--ok)!important}.b-acc{background:var(--accent)!important}
.c-no{color:var(--no)}.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-mut{color:var(--muted)}
.more{display:block;padding:12px 20px;border-top:1px solid var(--line);color:var(--accent);font-size:14px;cursor:pointer}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);font-size:15px;gap:8px}
.trow.h{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-top:0;padding-top:0;padding-bottom:6px}
.trow .r{text-align:right;font-family:var(--f-mono);font-size:14px}
.trow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrapbtn{padding:14px 20px;border-top:1px solid var(--line)}
.btn{appearance:none;border:0;border-radius:8px;min-height:44px;padding:10px 14px;font:600 15px/1.2 var(--f-body);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.wide{display:block;width:100%}
.ln2{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 20px;border-top:1px solid var(--line);font-size:15px}.ln2.f0{padding-left:0;padding-right:0}.ln2 .r{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.btn.in{background:var(--ok);color:#fff}.btn.out{background:var(--no);color:#fff}
.btn.in.ghost{background:transparent;color:var(--ok);border:1px solid var(--ok)}.btn.out.ghost{background:transparent;color:var(--no);border:1px solid var(--no)}
:root[data-theme="dark"] .btn.in,:root[data-theme="dark"] .btn.out{color:#0e1013}
.abar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.abar.x3{grid-template-columns:1fr 1fr 1fr}
.seg{display:flex;border-bottom:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:12px 4px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.form{padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);background:var(--tile)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld .l{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:16px;width:100%;min-width:0;font-family:inherit}
.fld textarea{resize:vertical;min-height:78px;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 12px;font-size:14px}
.chips button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.err{color:var(--no);font-size:13px;min-height:1em}
.cmp{padding:4px 20px 12px}
.cmp .ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
.cmp .ln .mono{white-space:nowrap}
.cmp .ln.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-weight:600}
.cmp input{width:90px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--tile);font-family:var(--f-mono)}
.tag{display:inline-block;font-size:12px;font-weight:600;line-height:1.2;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}.tag.no{color:var(--no);background:var(--no-bg);border-color:transparent}.tag.ok{color:var(--ok);border-color:currentColor}
.backb{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:12px 20px;color:var(--accent);font-size:15px;border-bottom:1px solid var(--line)}
.ent{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 20px;border-top:1px solid var(--line)}
.ent .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ent .t1{font-weight:500}.ent .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .am{font-family:var(--f-mono);text-align:right;white-space:nowrap}.ent .am small{display:block;color:var(--muted);font-size:12px}
.ent.call{background:var(--warn-bg)}
.bars{padding:8px 20px 12px;display:grid;gap:12px}
.br{display:grid;grid-template-columns:76px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:14px}
.br .tr{display:grid;gap:3px}.br .tr i{display:block;height:8px;border-radius:2px}
.br .v{text-align:right;font-family:var(--f-mono);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:0 20px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.search{padding:12px 20px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);background:var(--tile);border-radius:8px;padding:10px 12px;font-size:16px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:22px 0 8px}
/* bottom tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:14;display:flex;background:var(--bg);border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{all:unset;cursor:pointer;flex:1 1 0;min-width:0;text-align:center;color:var(--muted);font-size:11px;font-weight:500;min-height:60px;padding:8px 2px;border-top:3px solid transparent;margin-top:-1px;position:relative;box-sizing:border-box}
.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
.tabs button.on{color:var(--ink);font-weight:600;border-top-color:var(--accent)}
.tabs .bdg{position:absolute;top:6px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;line-height:18px}
/* pen layer */
#ink{position:absolute;left:0;top:0;z-index:20;pointer-events:none}
body.pen #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.penbar{position:fixed;right:max(12px,calc(50% - 280px + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:40;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 24px)}
.penbar .tools{display:none;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:4px 6px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
body.pen .penbar .tools{display:flex}
.penbar .tools button{all:unset;cursor:pointer;border-radius:14px;padding:5px 9px;font-size:13px;font-weight:600}
.penbar .tools button.on{background:var(--tile);color:var(--accent)}
.penbar .dot2{width:22px;height:22px;padding:0!important;display:grid;place-items:center}
.penbar .dot2 i{width:14px;height:14px;border-radius:50%;display:block}
.penbar .dot2.on{outline:2px solid var(--ink);outline-offset:-1px}
.fab{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.16);color:var(--ink);font-size:18px}
.fab.on{background:var(--no);color:#fff;border-color:var(--no)}
.st{font-size:11px;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:6px}
.note{position:fixed;right:max(12px,calc(50% - 280px + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 126px);z-index:41;width:min(340px,calc(100vw - 24px));background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:grid;gap:8px}
.note textarea{min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--tile);color:var(--ink);resize:vertical}
.note .row{display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:50;font-size:13px}
@media (max-width:560px){.app{border:0}.kpi b{font-size:22px}.trow{grid-template-columns:minmax(0,1fr) 80px 80px}}
/* phone: two-pane wrappers stack; the right pane replaces the left when a record is open */
.two,.k3{display:block}
.two.has .pL{display:none}.two:not(.has) .pR{display:none}
.dsk{display:none}
@media (min-width:960px){
  .app{max-width:none;border:0;margin:0 0 0 232px;padding-bottom:24px;min-height:100vh}
  .tabs{left:0;top:0;bottom:0;right:auto;transform:none;width:232px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:92px 10px 16px;gap:2px;justify-content:flex-start}
  .tabs button{flex:0 0 auto;display:flex;align-items:center;gap:12px;text-align:left;min-height:44px;padding:8px 12px;border-top:0;margin:0;border-radius:8px;font-size:15px;font-weight:500}
  .tabs button svg{margin:0;width:20px;height:20px}
  .tabs button.on{background:var(--tile);border-top:0}
  .tabs .bdg{position:static;margin-left:auto}
  .bar{padding:18px 28px 14px}
  .bar h1{font-size:26px}
  .sample{margin-left:28px}
  .two{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);align-items:start}
  .two .pL{display:block!important;border-right:1px solid var(--line);min-height:calc(100vh - 100px)}
  .two .pR{display:block!important}
  .two.wide{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .k3{display:grid;grid-template-columns:360px minmax(0,1fr) 380px;align-items:start}
  .k3>div{min-width:0;position:relative}.k3>div+div{border-left:1px solid var(--line);min-height:calc(100vh - 100px)}
  .k3 .kpi b{font-size:22px}
  .k3 .kpi div{padding-left:16px;padding-right:6px}
  .k3 .lbl2,.k3 .att,.k3 .cmp,.k3 .abar,.k3 .status,.k3 .form{padding-left:18px;padding-right:18px}
  .rsz{position:absolute;top:0;bottom:0;left:-5px;width:10px;cursor:col-resize;z-index:3}
  .rsz:hover,.rsz.on{background:linear-gradient(90deg,transparent 4px,var(--accent) 4px,var(--accent) 6px,transparent 6px)}
  .k3 .col-tog{position:absolute;top:14px;right:10px;z-index:4}
  .backb{display:none}
  .closewrap{max-width:720px}
  .lbl2,.att,.trow,.ent,.wrapbtn,.abar,.cmp,.bars,.legend,.search,.status,.form,.ln2:not(.f0){padding-left:28px;padding-right:28px}
  .kpi div{padding-left:28px}
  .kpi b{font-size:34px}
  .dsk{display:block}.mob{display:none}
  .penbar{right:20px;bottom:20px}.note{right:20px;bottom:76px}
  .foot{display:none}
  .menu{right:64px;top:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="tt"><div class="ws-name" id="wsName">Qarz daftari</div><h1 id="title">Bosh sahifa</h1><div class="meta"><span>Olloyor</span><span>Oktabr 2026</span><span>yangilangan <span class="mono">00:30</span></span></div></div>
    <button class="ib" id="wsBtn" aria-haspopup="menu" aria-label="Bo'limni almashtirish" title="Bo'lim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
    <button class="ib theme" id="themeBtn" role="switch" aria-checked="false" aria-label="Kun yoki tun" title="Kun / tun"><span class="sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span><span class="moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span></button>
    <div class="menu" id="wsMenu" role="menu" hidden>
      <button data-ws="d" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Qarz daftari</button>
      <button data-ws="k" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="10" width="18" height="10" rx="1.5"/><path d="M7 10V5h10v5"/><path d="M3 15h18"/><path d="M10 7.5h4"/></svg>Kassa</button>
    </div>
  </header>
  <span class="sample">Namuna ma'lumot</span>
  <main id="sheet" style="position:relative">
    <canvas id="ink" aria-hidden="true"></canvas>
    <section id="v-bosh"></section><section id="v-daftar" hidden></section><section id="v-qongiroq" hidden></section><section id="v-dhisobot" hidden></section>
    <section id="v-kassa" hidden></section><section id="v-kunlar" hidden></section><section id="v-hisobot" hidden></section>
    <div class="foot">@uzparts_hr_bot · daftar va kassa</div>
  </main>
</div>
<nav class="tabs" id="tabs" aria-label="Menyu"></nav>

<div class="penbar">

 <div class="form"><div class="row2"><label class="fld"><span class="l">Sanalgan dollar</span><input id="cU" inputmode="decimal" value="${cntU}" oninput="render();this.focus()"></label><label class="fld"><span class="l">Sanalgan so'm</span><input id="cS" inputmode="decimal" value="${cntS}" oninput="render();this.focus()"></label></div>
 <div class="ln2 f0"><span>Farq, dollar</span><span class="r ${Math.abs(dU)>0.5?'c-no':'c-ok'}">${dU>0?'+':''}${fmt(dU)}</span></div>
 <div class="ln2 f0"><span>Farq, so'm</span><span class="r ${Math.abs(dS)>500?'c-no':'c-ok'}">${dS>0?'+':''}${fmt(dS)}</span></div>
 ${Math.abs(dU)>0.5||Math.abs(dS)>500?`<label class="fld"><span class="l">Farq sababi (majburiy)</span><input id="cWhy" placeholder="masalan: 10 $ qaytim berilgan, yozilmagan"></label>`:`<div class="c-ok">Farq yo‘q, pul hisobga mos.</div>`}

 <div class="c-mut" style="font-size:13px">Bu raqam hisobotda "Bito'ga kiritilmagan" ustuniga tushadi. Hafta va oy bo'yicha yig'iladi.</div>

 return head+`<div class="lbl2">Kun yakuni · 21.10.2026</div>
 <div class="ln2"><span>Ochilishda</span><span class="r">420 $ · 1 200 000 so'm</span></div>
 <div class="ln2"><span>Kirim (${KAS.filter(k=>k.dir==='in').length} ta)</span><span class="r c-ok">+${fmt(inU)} $${inS?' · +'+fmt(inS)+" so'm":''}</span></div>
 <div class="ln2"><span>Chiqim (${KAS.filter(k=>k.dir==='out').length} ta)</span><span class="r c-no">−${fmt(outU)} $${outS?' · −'+fmt(outS)+" so'm":''}</span></div>
 <div class="ln2"><span>Sanalgan</span><span class="r">${fmt(cntU)} $ · ${fmt(cntS)} so'm</span></div>
 <div class="ln2"><span>Sanashdagi farq</span><span class="r ${Math.abs(dU)>0.5?'c-no':'c-ok'}">${dU>0?'+':''}${fmt(dU)} $</span></div>
 <div class="ln2"><span>Bito'ga kiritilmagan savdo</span><span class="r c-warn">${fmt(Math.abs(dB))} $</span></div>
 <div class="ln2" style="font-weight:600"><span>Ertangi ochilish qoldig'i</span><span class="r">${fmt(cntU)} $ · ${fmt(cntS)} so'm</span></div>
 <div class="form"><div class="chips"><button class="on">Kassir: Olloyor</button><button>Rahbar ko'rdi</button></div>
 <div class="c-mut" style="font-size:13px">Tasdiqlangach: kun qulflanadi, PDF tayyorlanadi (imzo joylari bilan) va "Kunlar" ro'yxatiga tushadi. Ochish faqat rahbar huquqi bilan.</div>
 <div class="row2"><button class="btn ghost" onclick="kstep=1;render()">Orqaga</button><button class="btn" onclick="kclose=0;kstep=1;toast('Kun yopildi (namuna)');go('kunlar')">Kunni yopish va PDF</button></div></div>`}
function vKunlar(){const D=[['21.10','ochiq',1000,250,'—',null],['20.10','yopildi',1480,620,'0',180],['19.10','yopildi',2210,410,'−10',340],['18.10','yopildi',890,1300,'0',0],['17.10','yopildi',3120,950,'+5',610]];
 return `<div class="two"><div class="pL"><div class="seg"><button class="on">Oktyabr</button><button>Sentyabr</button><button>Avgust</button></div>
 <div class="kpi"><div><b class="c-ok">8 700</b><span>kirim, $</span></div><div><b class="c-no">3 530</b><span>chiqim, $</span></div><div><b class="c-warn">1 130</b><span>Bito'ga kiritilmagan, $</span></div></div>
 </div><div class="pR"><div class="lbl2">Kunlar</div>
 ${D.map(d=>att(d[1]==='ochiq'?'b-acc':d[4]!=='0'?'b-warn':'b-ok',`${d[0]} · <span class="mono">+${fmt(d[2])} / −${fmt(d[3])}</span>`,`${d[1]}${d[4]!=='—'?' · sanashda farq '+d[4]:''}${d[5]!=null?" · Bito'ga kiritilmagan "+fmt(d[5])+' $':''}`,d[1]==='ochiq'?'<span class="tag warn">ochiq</span>':'<span class="tag">🔒 PDF</span>')).join('')}
 <div class="lbl2">Qoida</div><div class="trow" style="display:block;font-size:14px;color:var(--muted)">Yopilgan kun qulflanadi: yozuvlarni o'zgartirib, o'chirib yoki qo'shib bo'lmaydi. Xato topilsa rahbar kunni "ochadi", sabab yoziladi va bu jurnalda qoladi; keyin qayta yopiladi va yangi PDF chiqadi.</div></div></div>`}
function vHisobot(){const M=[['Okt 26',16900,9400],['Sen 26',15200,8100],['Okt 25',11800,0]];const mx=Math.max(...M.map(m=>m[1]));
 return `<div class="two wide"><div class="pL"><div class="seg"><button>Kun</button><button>Hafta</button><button class="on">Oy</button><button>Yil</button></div>
 <div class="form" style="border-top:0"><div class="row2"><label class="fld"><span class="l">Dan</span><input type="date" value="2026-10-01"></label><label class="fld"><span class="l">Gacha</span><input type="date" value="2026-10-21"></label></div>
 <div class="chips"><button class="on">Hammasi</button><button>Faqat kirim</button><button>Faqat chiqim</button><button>Ta'minotchiga</button><button>Rahbarga</button></div>
 <div class="row2"><button class="btn">Excel'ga olish</button><button class="btn ghost">PDF · imzo uchun</button></div><div class="row2"><button class="btn ghost">Telegramga yuborish</button><button class="btn ghost">O'tgan oy bilan solishtirish</button></div></div>
 <div class="kpi"><div><b>16 900</b><span>kirim, $ · +11%</span></div><div><b>5 640</b><span>chiqim, $</span></div><div><b class="c-warn">1 870</b><span>Bito'ga kiritilmagan, $</span></div></div>
 <div class="lbl2">Kassa kirimi tarkibi</div>
 <div class="bars">${M.map(m=>`<div class="br"><span>${m[0]}</span><span class="tr" style="display:flex;gap:0"><i style="width:${m[2]/mx*100}%;background:var(--accent)"></i><i style="width:${(m[1]-m[2])/mx*100}%;background:var(--warn-bar)"></i></span><span class="v">${fmt(m[1])}</span></div>`).join('')}</div>
 <div class="legend"><span><i style="background:var(--accent)"></i>Bito savdosi</span><span><i style="background:var(--warn-bar)"></i>qarz to'lovi va kiritilmagan</span><span>Okt 25 eski Excel'dan</span></div></div><div class="pR">
 <div class="lbl2"><span class="grow">Hisobot tarkibi · 01.10 – 21.10</span><span>$</span></div>
 <div class="trow h"><span>Qator</span><span class="r">Soni</span><span class="r">Summa</span></div>
 <div class="ln2"><span>Kirim: savdo (naqd)</span><span class="r c-mut">212</span><span class="r">9 400</span></div>
 <div class="ln2"><span>Kirim: qarz to'lovi</span><span class="r c-mut">31</span><span class="r">7 500</span></div>
 <div class="ln2"><span>Chiqim: ta'minotchiga</span><span class="r c-mut">9</span><span class="r c-no">−3 500</span></div>
 <div class="ln2"><span>Chiqim: boshqa turlar</span><span class="r c-mut">38</span><span class="r c-no">−2 140</span></div>
 <div class="ln2"><span>Sanashdagi farqlar</span><span class="r c-mut">3 kun</span><span class="r c-warn">−15</span></div>
 <div class="ln2" style="font-weight:600"><span>Kassa qoldig'i, 21.10</span><span class="r"></span><span class="r">1 170</span></div>
 <div class="lbl2"><span class="grow">Chiqim turlari</span><span>$</span></div>
 <div class="trow h"><span>Tur</span><span class="r">Sentyabr</span><span class="r">Oktyabr</span></div>
 ${[["Ta'minotchiga",2900,3500],["Yo'l / yulkira",640,780],['Oylik / avans',900,900],["Xo'jalik",210,160],['Rahbarga berildi',1200,300]].map(r=>`<div class="ln2"><span>${r[0]}</span><span class="r c-mut">${fmt(r[1])}</span><span class="r">${fmt(r[2])}</span></div>`).join('')}</div></div>`}
const isDesk=()=>window.matchMedia('(min-width:960px)').matches;
const R={bosh:vBosh,daftar:vDaftar,qongiroq:vQong,dhisobot:vDHis,kassa:()=>kclose?vClose():vKassa(),kunlar:vKunlar,hisobot:vHisobot};
function render(){for(const v in R){const el=$('v-'+v);el.hidden=v!==view;if(v===view)el.innerHTML=R[v]()}
 const ws=VIEWS[view].ws;lastIn[ws]=view;$('wsName').textContent=ws==='d'?'Qarz daftari':'Kassa';$('title').textContent=view==='daftar'&&cur?'Mijoz':view==='kassa'&&kclose?'Kunni yopish':VIEWS[view].t;
 document.querySelectorAll('#wsMenu button').forEach(b=>b.classList.toggle('on',b.dataset.ws===ws));
 $('tabs').innerHTML=Object.entries(VIEWS).filter(([k,v])=>v.ws===ws).map(([k,v])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${I[v.ic]}${v.tab}${v.bdg?`<span class="bdg">${v.bdg}</span>`:''}</button>`).join('');
 wire();sizeInk()}
function go(v){if(v!=='daftar')cur=null;if(v!=='kassa'){kclose=0;kstep=1}view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0);$('noteTitle').textContent='Izoh · '+VIEWS[v].t;loadNote()}
function openCust(id){cur=id;view='daftar';render();window.scrollTo(0,0)}
function openForm(d){kdir=d;kcat=CATS[d][d==='out'?1:0];kform=true;render();setTimeout(()=>$('kA')&&$('kA').focus(),0)}
function openCustKeep(id){cur=id;render()}
function wire(){
 if(view==='daftar'){$('dq').oninput=()=>{const q=$('dq').value.trim().toLowerCase();$('clist').innerHTML=CUST.filter(c=>!q||(c.n+' '+c.city).toLowerCase().includes(q)).map(custRow).join('')}}
 if(view==='kassa'&&!kclose){wireResize();const calc=()=>{const sale=KAS.filter(k=>k.cat==='Savdo').reduce((a,k)=>a+k.a,0);const d=sale-(+$('kBito').value||0);$('kDiff').textContent=fmt(Math.abs(d))+' $';$('kDiffL').textContent=d>=0?"Bito'ga kiritilmagan savdo":"Bito'da bor, kassaga tushmagan"};$('kBito').oninput=calc;calc();
  if(kform){$('kCats').querySelectorAll('button').forEach(b=>b.onclick=()=>{kcat=b.textContent;$('kCats').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
   $('kWq').querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=b.textContent;const w=$('kW');if(t.endsWith('…')){w.value='';w.focus()}else{w.value=t;$('kY').focus()}});
   $('kSave').onclick=()=>{const a=+String($('kA').value).replace(/\s/g,'').replace(',','.'),who=$('kW').value.trim(),why=$('kY').value.trim();
    if(!a){$('kErr').textContent='Summani kiriting';$('kA').focus();return}if(!who){$('kErr').textContent=(kdir==='in'?'Kimdan':'Kimga')+' ekanini yozing';$('kW').focus();return}if(!why&&kcat!=='Savdo'&&kcat!=="Qarz to'lovi"){$('kErr').textContent='Nima uchun ekanini yozing';$('kY').focus();return}
    const t=new Date();KAS.unshift({tm:String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'),dir:kdir,cat:kcat,who,why,a,cur:$('kC').value});kform=false;render();toast('Kassaga yozildi (namuna)')}}}
}
function toast(m){$('toastBox').innerHTML=`<div class="toast">${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toastBox').innerHTML='',2600)}
/* workspace menu + theme */
$('wsBtn').onclick=e=>{e.stopPropagation();const m=$('wsMenu');m.hidden=!m.hidden;$('wsBtn').classList.toggle('on',!m.hidden)};
document.querySelectorAll('#wsMenu button').forEach(b=>b.onclick=()=>{$('wsMenu').hidden=true;$('wsBtn').classList.remove('on');go(lastIn[b.dataset.ws])});
document.addEventListener('click',e=>{if(!$('wsMenu').hidden&&!e.target.closest('#wsMenu')){$('wsMenu').hidden=true;$('wsBtn').classList.remove('on')}});
function sysDark(){return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
function curTheme(){return document.documentElement.getAttribute('data-theme')||(sysDark()?'dark':'light')}
function paintTheme(){const d=curTheme()==='dark';$('themeBtn').classList.toggle('dark',d);$('themeBtn').setAttribute('aria-checked',d?'true':'false')}
$('themeBtn').onclick=()=>{const n=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('dk-theme',n)}catch(e){}paintTheme();draw()};
try{const t=localStorage.getItem('dk-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
paintTheme();

/* ---------------- pen layer: strokes per view in the shared db (collection "strokes"), notes in "notes" ---------------- */
const ink=$('ink'),ctx=ink.getContext('2d');
let pen=false,color='red',wide=false,erase=false,strokes=[],live=null,db=null,notesCache={};
const COLORS={red:'--pen-red',blue:'--pen-blue',ink:'--ink',hl:'--pen-hl'};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function W(){return $('sheet').clientWidth||1}
function sizeInk(){const s=$('sheet');const w=s.clientWidth,h=Math.max(s.scrollHeight,s.clientHeight);const dpr=window.devicePixelRatio||1;ink.style.width=w+'px';ink.style.height=h+'px';ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function drawStroke(st){const k=W()/1000,p=st.p;if(!p||p.length<2)return;ctx.strokeStyle=css(COLORS[st.c]||COLORS.red);ctx.lineWidth=st.c==='hl'?14:(st.w||2.5);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(p[0]*k,p[1]*k);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i]*k,p[i+1]*k);if(p.length===2)ctx.lineTo(p[0]*k+.1,p[1]*k);ctx.stroke()}
function draw(){ctx.clearRect(0,0,ink.width,ink.height);for(const s of strokes)if(s.view===view)drawStroke(s);if(live&&live.p)drawStroke(live)}
function pt(e){const r=ink.getBoundingClientRect();const k=1000/W();return[Math.round((e.clientX-r.left)*k),Math.round((e.clientY-r.top)*k)]}
ink.addEventListener('pointerdown',e=>{if(!pen)return;e.preventDefault();ink.setPointerCapture(e.pointerId);const [x,y]=pt(e);if(erase){eraseAt(x,y);live={erasing:true};return}live={view,c:color,w:wide?5:2.5,p:[x,y]};draw()});
ink.addEventListener('pointermove',e=>{if(!live)return;const [x,y]=pt(e);if(live.erasing){eraseAt(x,y);return}const p=live.p,n=p.length;if(Math.abs(p[n-2]-x)+Math.abs(p[n-1]-y)<3)return;p.push(x,y);draw()});
const end=()=>{if(!live)return;const s=live;live=null;if(s.erasing)return;if(s.p.length>=2){s.id='l'+Date.now()+Math.random().toString(36).slice(2,6);s.t=new Date().toISOString();strokes.push(s);draw();persist(s)}};
ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
function eraseAt(x,y){const hit=strokes.filter(s=>s.view===view).find(s=>{for(let i=0;i<s.p.length;i+=2)if(Math.abs(s.p[i]-x)<14&&Math.abs(s.p[i+1]-y)<14)return true;return false});if(hit)removeStroke(hit)}
function persist(s){const body={view:s.view,c:s.c,w:s.w,p:s.p,t:s.t};if(db){setSt('Saqlanmoqda…');db.collection('strokes').doc(s.id).set(body).then(()=>setSt('Saqlandi')).catch(err=>setSt(err&&err.code==='invalid_argument'?"Saqlash huquqi yo'q":'Saqlanmadi'))}else saveLocal()}
function removeStroke(s){strokes=strokes.filter(x=>x!==s);draw();if(db)db.collection('strokes').doc(s.id).delete().then(()=>setSt("O'chirildi")).catch(()=>setSt("O'chirilmadi"));else saveLocal()}
function saveLocal(){try{localStorage.setItem('dk-strokes',JSON.stringify(strokes))}catch(e){}setSt('Faqat shu brauzerda')}
function setSt(t){$('st').textContent=t}
$('penBtn').onclick=()=>{pen=!pen;document.body.classList.toggle('pen',pen);$('penBtn').classList.toggle('on',pen);if(!pen){erase=false;$('eBtn').classList.remove('on')}sizeInk()};
document.querySelectorAll('.penbar .dot2').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;$('eBtn').classList.remove('on');document.querySelectorAll('.penbar .dot2').forEach(x=>x.classList.toggle('on',x===b))});
$('wBtn').onclick=()=>{wide=!wide;$('wBtn').textContent=wide?'Qalin':'Ingichka'};
$('eBtn').onclick=()=>{erase=!erase;$('eBtn').classList.toggle('on',erase)};
$('uBtn').onclick=()=>{const mine=strokes.filter(s=>s.view===view);if(mine.length)removeStroke(mine[mine.length-1])};
let clearArm=0;$('cBtn').onclick=()=>{if(Date.now()-clearArm>3000){clearArm=Date.now();$('cBtn').textContent='Yana bosing';setTimeout(()=>$('cBtn').textContent='Tozalash',3000);return}clearArm=0;$('cBtn').textContent='Tozalash';for(const s of strokes.filter(x=>x.view===view))removeStroke(s)};
$('nBtn').onclick=()=>{$('note').hidden=!$('note').hidden;if(!$('note').hidden){loadNote();$('noteText').focus()}};
$('noteClose').onclick=()=>{$('note').hidden=true};
function loadNote(){$('noteText').value=notesCache[view]||'';$('noteSt').textContent=notesCache[view]?'Saqlangan izoh':''}
$('noteSave').onclick=()=>{const txt=$('noteText').value.trim();notesCache[view]=txt;if(db){$('noteSt').textContent='Saqlanmoqda…';db.doc('notes/'+view).set({view,text:txt,t:new Date().toISOString()}).then(()=>{$('noteSt').textContent='Saqlandi';toast('Izoh saqlandi')}).catch(()=>$('noteSt').textContent='Saqlanmadi')}else{try{localStorage.setItem('dk-notes',JSON.stringify(notesCache))}catch(e){}$('noteSt').textContent='Faqat shu brauzerda'}};
let wasDesk=isDesk();window.addEventListener('resize',()=>{const d=isDesk();if(d!==wasDesk){wasDesk=d;render()}else sizeInk()});
(function(){const h=(location.hash||'').slice(1);if(VIEWS[h])view=h})();
try{strokes=JSON.parse(localStorage.getItem('dk-strokes')||'[]');notesCache=JSON.parse(localStorage.getItem('dk-notes')||'{}')}catch(e){}
go(view);setSt('Ulanmoqda…');
(async()=>{try{if(!window.claude||!claude.use){setSt('Faqat shu brauzerda');return}db=await claude.use('db');if(!db){setSt('Faqat shu brauzerda');return}setSt('Ulandi');
 db.collection('strokes').onSnapshot(snap=>{strokes=snap.docs.map(d=>Object.assign({id:d.id},d.data()));draw();setSt(strokes.length?strokes.length+' ta chiziq':'Ulandi')},()=>setSt('Ulanish uzildi'));
 db.collection('notes').onSnapshot(snap=>{notesCache={};snap.docs.forEach(d=>{const x=d.data();notesCache[x.view||d.id]=x.text||''});if(!$('note').hidden&&document.activeElement!==$('noteText'))loadNote()},()=>{});
}catch(e){setSt('Faqat shu brauzerda')}})();
</script>
