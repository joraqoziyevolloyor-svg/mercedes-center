<script>

  }
  function setTheme(p) { try { if (p === 'auto') localStorage.removeItem('mc-theme'); else localStorage.setItem('mc-theme', p); } catch (e) {} applyTheme(p); }
  applyTheme(themePref());
  try { if (inTg) tg.onEvent('themeChanged', function () { if (themePref() === 'auto') applyTheme('auto'); }); } catch (e) {}
  function themeSeg() {
    var seg = el('div', 'seg'), SB = {};
    [['auto', 'Telefon bo\'yicha'], ['light', 'Oq'], ['dark', 'Qora']].forEach(function (x) {
      var b = el('button', null, x[1]); b.type = 'button'; SB[x[0]] = b;
      b.addEventListener('click', function () { setTheme(x[0]); Object.keys(SB).forEach(function (q) { SB[q].setAttribute('aria-selected', String(q === x[0])); }); });
      seg.appendChild(b);

  }

  function fail(msg) { $('error').textContent = msg; $('error').hidden = false; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function arr(x) { return Array.isArray(x) ? x : null; }

  function more(box, n, what) { if (n > 0) box.appendChild(el('p', 'more', 'yana ' + n + ' ta ' + what + ' sig\'madi')); }
  function td(cls, text) { return el('td', cls, text); }
  function tag(cls, text) { return el('span', 'tag' + (cls ? ' ' + cls : ''), text); }
  function cell(cls, node) { var c = el('td', cls); c.appendChild(node); return c; }
  function hideAll() { ['worker', 'tasksBox', 'monthBox', 'teamBox', 'teamTasksBox'].forEach(function (k) { $(k).hidden = true; }); }
  function b64bytes(s) {
    var b = s.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  var MAX_Z = 8000, MAX_OUT = 200000; // bot URL'i 3000 belgigacha; ochilgan JSON 200 KB dan oshmaydi
  function decode() {
    // Ma'lumot faqat URL'ning # qismida keladi (serverga yuborilmaydi):
    // #z=<base64url(deflate-raw(JSON))> (v2, bot v14) yoki eski #d=<base64url(JSON)> (v1, bot v13).
    // Telegram o'z parametrlarini (& yoki #kb kabi) qo'shishi mumkin; # qismi Telegram skriptidan oldin olib qo'yilgan.
    var h = window.__mcHash || String(location.hash || '');
    var z = h.match(/[#&]z=([A-Za-z0-9_-]+)/);
    if (z) return decodeZ(z[1]);
    var m = h.match(/[#&]d=([A-Za-z0-9_-]+)/);

    try { return Promise.resolve(JSON.parse(new TextDecoder().decode(b64bytes(m[1])))); } catch (e) { return Promise.resolve(null); }
  }
  function decodeZ(zs) {
    {
      var ds;
      try { ds = new DecompressionStream('deflate-raw'); } catch (e) { return Promise.reject({ upd: 1 }); }
      if (zs.length > MAX_Z) return Promise.reject(new Error('big'));
      var bytes = b64bytes(zs);
      // Ochishni bo'laklab o'qiymiz va MAX_OUT dan oshsa darhol to'xtatamiz (siqilgan "bomba" xotirani to'ldirmasin)
      var reader = new Blob([bytes]).stream().pipeThrough(ds).getReader(), chunks = [], total = 0;
      var pump = function () {
        return reader.read().then(function (res) {
          if (res.done) {
            var all = new Uint8Array(total), off = 0;
            chunks.forEach(function (c) { all.set(c, off); off += c.length; });
            return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(all));
          }
          total += res.value.length;
          if (total > MAX_OUT) { try { reader.cancel().catch(function () {}); } catch (e) {} throw new Error('big'); }
          chunks.push(res.value);
          return pump();
        });
      };
      return pump();
    }
  }
  function done(id, row, btn) {
    if (!inTg) return fail('Bu tugma faqat Telegram\'dagi bot ichida ishlaydi.');
    if (inline) return fail('"Bajarildi" ni belgilash uchun bu oynani chat pastidagi "📊 Mening ishim" tugmasi orqali oching.');

    } catch (e) {

  var doneFn = done; // v2 ma'lumotida doneV2 bilan almashtiriladi

  }

  function monthInfo(d) {

  // v1 (bot v13) sahifasi va v2 xodimning "Mening ishim" qismi: o'zgarishsiz chizish
  function render(d) {
