<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mening ishim</title>
<script>window.__mcHash = String(location.hash || '');</script>
<!-- Telegram WebApp skriptining shu papkadagi qotirilgan nusxasi (telegram-web-app.js, sha256 TELEGRAM-WEB-APP.md da) -->
<script src="telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #fff); --fg: var(--tg-theme-text-color, #1b2429); --muted: var(--tg-theme-hint-color, #6b7780);
          --card: var(--tg-theme-secondary-bg-color, #f1f4f6); --btn: var(--tg-theme-button-color, #0f6e8c); --btn-fg: var(--tg-theme-button-text-color, #fff);
          --bad: #c0392b; --good: #1e8449; --warn: #b9770e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .late { color: var(--warn); font-weight: 600; }
  .off { color: var(--muted); }
  .miss { color: var(--bad); }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
  .task:last-child { border-bottom: 0; }
  .task .txt { flex: 1; }
  .task.done .txt { color: var(--muted); text-decoration: line-through; }
  button { appearance: none; border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-fg); white-space: nowrap; }
  .bad { color: var(--bad); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div>
    <h1 id="title">📊 Mening ishim</h1>
    <p class="muted" id="sub"></p>
  </div>
  <p id="error" class="bad" hidden></p>

  <section id="worker" hidden>
    <div class="stats">
      <div class="stat"><b id="sDays">0</b><span class="muted">kun keldi</span></div>
      <div class="stat"><b id="sLate">0</b><span class="muted">daq kechikish</span></div>
      <div class="stat"><b id="sOpen">0</b><span class="muted">topshiriq</span></div>
    </div>
  </section>

  <section class="card" id="tasksBox" hidden>
    <h2>📌 Topshiriqlar</h2>
    <div id="tasks"></div>
  </section>

  <section class="card" id="monthBox" hidden>
    <h2 id="monthTitle">Oy</h2>
    <table><thead><tr><th>Kun</th><th>Keldi</th><th>Ketdi</th><th>Kechikish</th></tr></thead><tbody id="days"></tbody></table>
  </section>

  <section class="card" id="teamBox" hidden>
    <h2>👥 Bugun</h2>
    <table><thead><tr><th>Xodim</th><th>Keldi</th><th>Ketdi</th><th>Oy: kun / kech</th></tr></thead><tbody id="team"></tbody></table>
  </section>

  <section class="card" id="teamTasksBox" hidden>
    <h2>📌 Ochiq topshiriqlar</h2>
    <div id="teamTasks"></div>
  </section>

  <p class="muted">Ma'lumot bot tugmani oxirgi marta yangilagan paytdagi holat. Yangilash uchun botga /start yozing.</p>
</main>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  var WD = ['Ya', 'Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh'];
  // Klaviatura tugmasidan ochilganda initData bo'sh bo'ladi (Telegram hujjati), shuning uchun faqat Telegram yo'qligini tekshiramiz.
  var inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
  var inline = !!(inTg && tg.initDataUnsafe && tg.initDataUnsafe.query_id); // inline tugma: sendData ishlamaydi
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  function fail(msg) { $('error').textContent = msg; $('error').hidden = false; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function arr(x) { return Array.isArray(x) ? x : null; }
  function num(x) { x = Number(x); return isFinite(x) && x > 0 ? Math.floor(x) : 0; }
  function str(x) { return x == null ? '' : String(x); }
  function more(box, n, what) { if (n > 0) box.appendChild(el('p', 'muted', 'yana ' + n + ' ta ' + what + ' sig\'madi')); }
  function decode() {
    // Ma'lumot faqat URL'ning # qismida keladi (serverga yuborilmaydi): #d=<base64url(JSON)>.
    // Telegram o'z parametrlarini (& yoki #kb kabi) qo'shishi mumkin; # qismi Telegram skriptidan oldin olib qo'yilgan.
    var h = window.__mcHash || String(location.hash || '');
    var m = h.match(/[#&]d=([A-Za-z0-9_-]+)/);
    if (!m) return null;
    var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function done(id, row, btn) {
    if (!inTg) return fail('Bu tugma faqat Telegram\'dagi bot ichida ishlaydi.');
    if (inline) return fail('"Bajarildi" ni belgilash uchun bu oynani chat pastidagi "📊 Mening ishim" tugmasi orqali oching.');
    btn.disabled = true;
    try {
      tg.sendData(JSON.stringify({ v: 1, t: 'done', id: id })); // oyna yopiladi, bot javob beradi
    } catch (e) {
      btn.disabled = false;
      return fail("Botga yuborib bo'lmadi. Bu oynani chat pastidagi \"📊 Mening ishim\" tugmasi orqali oching.");
    }
    row.classList.add('done');
  }
  function taskRow(t, who, canDone) {
    // t = [id, matn, berilgan sana, bajarilgan 0/1]
    var row = el('div', 'task' + (t[3] ? ' done' : ''));
    var txt = el('div', 'txt');
    txt.appendChild(el('div', null, str(t[1])));
    txt.appendChild(el('div', 'muted', (who ? who + ' · ' : '') + str(t[2]) + (t[3] ? ' · bajarildi' : '')));
    row.appendChild(txt);
    var id = Number(t[0]);
    if (canDone && !t[3] && id > 0) { var b = el('button', null, '✅ Bajarildi'); b.onclick = function () { done(id, row, b); }; row.appendChild(b); }
    return row;
  }

  function render(d) {
    $('title').textContent = (d.r === 'o' ? '📊 Ish holati' : '📊 Mening ishim');
    $('sub').textContent = str(d.n) + ' · ' + str(d.m) + (d.h ? ' · ish vaqti ' + str(d.h) : '') + ' · yangilangan ' + str(d.u);

    // Xodimning o'z oyi
    var days = arr(d.d), tasks = arr(d.t);
    if (days) {
      days = days.filter(function (r) { return Array.isArray(r) && num(r[0]) >= 1 && num(r[0]) <= 31; }).slice(-31);
      var lateSum = 0, came = 0;
      days.forEach(function (r) { if (r[1]) came++; lateSum += num(r[3]); });
      // Bot jami qiymatlarni alohida yuborsa (ro'yxat qisqartirilgan bo'lishi mumkin), o'shalar ishlatiladi
      $('sDays').textContent = d.c != null ? num(d.c) : came;
      $('sLate').textContent = d.l != null ? num(d.l) : lateSum;
      $('sOpen').textContent = d.o != null ? num(d.o) : (tasks || []).filter(function (t) { return Array.isArray(t) && !t[3]; }).length;
      $('worker').hidden = false;
      var mm = /^(\d{4})-(\d{2})$/.exec(str(d.m)), y = mm ? +mm[1] : 2000, mo = mm ? +mm[2] : 1;
      $('monthTitle').textContent = '🗓 ' + str(d.m);
      var tb = $('days');
      days.slice().reverse().forEach(function (r) {
        var wd = mm ? ' ' + WD[new Date(Date.UTC(y, mo - 1, num(r[0]))).getUTCDay()] : '';
        var late = num(r[3]);
        var tr = el('tr', r[4] ? 'off' : (!r[1] ? 'miss' : null));
        tr.appendChild(el('td', null, num(r[0]) + wd));
        tr.appendChild(el('td', null, r[1] ? str(r[1]) : (r[4] ? 'dam olish' : '—')));
        tr.appendChild(el('td', null, r[2] ? str(r[2]) : '—'));
        tr.appendChild(el('td', late > 0 ? 'late' : null, late > 0 ? late + ' daq' : ''));
        tb.appendChild(tr);
      });
      var dMore = num(d.dn) - days.length;
      if (dMore > 0) $('monthBox').appendChild(el('p', 'muted', 'yana ' + dMore + ' ta oldingi kun sig\'madi (jami yuqorida hisoblangan)'));
      $('monthBox').hidden = false;
    }
    if (tasks) {
      var box = $('tasks');
      tasks = tasks.filter(Array.isArray);
      if (!tasks.length) box.appendChild(el('p', 'muted', "Hozircha topshiriq yo'q."));
      tasks.forEach(function (t) { box.appendChild(taskRow(t, null, true)); });
      more(box, num(d.tn) - tasks.length, 'topshiriq');
      $('tasksBox').hidden = false;
    }
    // Egasi: hamma xodimlar bugun va oy bo'yicha
    var team = arr(d.s);
    if (team) {
      var tt = $('team');
      team.filter(Array.isArray).forEach(function (r) {
        // r = [ism, keldi, ketdi, bugun kechikish, oyda kelgan kun, oyda kechikish daq, bugun dam olish 0/1]
        var late = num(r[3]);
        var tr = el('tr', r[6] ? 'off' : (!r[1] ? 'miss' : null));
        tr.appendChild(el('td', null, str(r[0])));
        tr.appendChild(el('td', late > 0 ? 'late' : null, r[1] ? str(r[1]) + (late > 0 ? ' (+' + late + ')' : '') : (r[6] ? 'dam' : '—')));
        tr.appendChild(el('td', null, r[2] ? str(r[2]) : '—'));
        tr.appendChild(el('td', null, num(r[4]) + ' / ' + num(r[5]) + ' daq'));
        tt.appendChild(tr);
      });
      more($('teamBox'), num(d.sn) - team.length, 'xodim');
      $('teamBox').hidden = false;
    }
    var ot = arr(d.ot);
    if (ot) {
      var tbx = $('teamTasks');
      ot = ot.filter(Array.isArray);
      if (!ot.length) tbx.appendChild(el('p', 'muted', "Ochiq topshiriq yo'q."));
      ot.forEach(function (t) { tbx.appendChild(taskRow([t[0], t[2], t[3], 0], str(t[1]), false)); });
      more(tbx, num(d.on) - ot.length, 'ochiq topshiriq');
      $('teamTasksBox').hidden = false;
    }
  }

  var d;
  try { d = decode(); } catch (e) { d = null; }
  if (!d || typeof d !== 'object' || d.v !== 1) { fail(inTg ? "Ma'lumot topilmadi. Botga /start yozib, tugmani qayta bosing." : 'Bu sahifa faqat Mercedes Center botidagi "📊 Mening ishim" tugmasidan ochiladi.'); return; }
  try { render(d); } catch (e) { fail("Ma'lumotni ko'rsatib bo'lmadi. Botga /start yozib, tugmani qayta bosing."); }
})();
</script>
</body>
</html>
