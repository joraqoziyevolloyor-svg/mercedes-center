<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;

  if (tg) {

  function fail(msg) { $('error').textContent = msg; $('error').hidden = false; }

  function hideAll() { ['worker', 'tasksBox', 'monthBox', 'teamBox', 'teamTasksBox'].forEach(function (k) { $(k).hidden = true; }); }
  function b64bytes(s) {
    var b = s.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  var MAX_Z = 8000, MAX_OUT = 200000; // bot URL'i 3000 belgigacha; ochilgan JSON 200 KB dan oshmaydi
  function decode() {
    // Ma'lumot faqat URL'ning # qismida keladi (serverga yuborilmaydi):
    // #z=<base64url(deflate-raw(JSON))> (v2, bot v14) yoki eski #d=<base64url(JSON)> (v1, bot v13).
    // Telegram o'z parametrlarini (& yoki #kb kabi) qo'shishi mumkin; # qismi Telegram skriptidan oldin olib qo'yilgan.
    var h = window.__mcHash || String(location.hash || '');
    var z = h.match(/[#&]z=([A-Za-z0-9_-]+)/);
    if (z) return decodeZ(z[1]);
    var m = h.match(/[#&]d=([A-Za-z0-9_-]+)/);
    if (!m || m[1].length > MAX_Z) return Promise.resolve(null);
    try { return Promise.resolve(JSON.parse(new TextDecoder().decode(b64bytes(m[1])))); } catch (e) { return Promise.resolve(null); }
  }
  function decodeZ(zs) {
    {
      var ds;
      try { ds = new DecompressionStream('deflate-raw'); } catch (e) { return Promise.reject({ upd: 1 }); }
      if (zs.length > MAX_Z) return Promise.reject(new Error('big'));
      var bytes = b64bytes(zs);
      // Ochishni bo'laklab o'qiymiz va MAX_OUT dan oshsa darhol to'xtatamiz (siqilgan "bomba" xotirani to'ldirmasin)
      var reader = new Blob([bytes]).stream().pipeThrough(ds).getReader(), chunks = [], total = 0;
      var pump = function () {
        return reader.read().then(function (res) {
          if (res.done) {
            var all = new Uint8Array(total), off = 0;
            chunks.forEach(function (c) { all.set(c, off); off += c.length; });
            return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(all));
          }
          total += res.value.length;
          if (total > MAX_OUT) { try { reader.cancel().catch(function () {}); } catch (e) {} throw new Error('big'); }
          chunks.push(res.value);
          return pump();
        });
      };
      return pump();
    }
  }
  function done(id, row, btn) {
    if (!inTg) return fail('Bu tugma faqat Telegram\'dagi bot ichida ishlaydi.');
    if (inline) return fail('"Bajarildi" ni belgilash uchun bu oynani chat pastidagi "📊 Mening ishim" tugmasi orqali oching.');
    btn.disabled = true;
    try {
      tg.sendData(JSON.stringify({ v: 1, t: 'done', id: id })); // oyna yopiladi, bot javob beradi
    } catch (e) {
      btn.disabled = false;
      return fail("Botga yuborib bo'lmadi. Bu oynani chat pastidagi \"📊 Mening ishim\" tugmasi orqali oching.");
    }
    row.classList.add('done');
  }
  var doneFn = done; // v2 ma'lumotida doneV2 bilan almashtiriladi
  function taskRow(t, who, canDone) {
    // t = [id, matn, berilgan sana, bajarilgan 0/1]
    var row = el('div', 'task' + (t[3] ? ' done' : ''));
    var txt = el('div', 'txt');
    txt.appendChild(el('div', null, str(t[1])));
    txt.appendChild(el('div', 'muted', (who ? who + ' · ' : '') + str(t[2]) + (t[3] ? ' · bajarildi' : '')));
    row.appendChild(txt);
    var id = Number(t[0]);
    if (canDone && !t[3] && Number.isSafeInteger(id) && id > 0) { var b = el('button', null, 'Bajarildi'); b.type = 'button'; b.addEventListener('click', function () { doneFn(id, row, b, txt); }); row.appendChild(b); }
    return row;
  }

  function monthInfo(d) {
    var mm = /^(\d{4})-(\d{2})$/.exec(str(d.m)), y = mm ? +mm[1] : 2000, mo = mm ? +mm[2] : 1;
    if (mm && (mo < 1 || mo > 12)) { mm = null; y = 2000; mo = 1; }
    return { mm: mm, y: y, mo: mo, name: mm ? MONTHS[mo - 1] + ' ' + y : str(d.m) };
  }
  function header(d) {
    $('title').textContent = (d.r === 'o' ? 'Ish holati' : 'Mening ishim');
    var mi = monthInfo(d);
    var sub = $('sub');
    sub.appendChild(el('span', null, str(d.n)));
    if (mi.name) sub.appendChild(el('span', null, mi.name));
    if (d.h) { var hs = el('span', null, 'ish vaqti '); hs.appendChild(el('span', 'mono', str(d.h))); sub.appendChild(hs); }
    var us = el('span', null, 'yangilangan '); us.appendChild(el('span', 'mono', str(d.u))); sub.appendChild(us);
    return mi;
  }

  // v1 (bot v13) sahifasi va v2 xodimning "Mening ishim" qismi: o'zgarishsiz chizish
  function render(d) {
    var mi = header(d), mm = mi.mm, y = mi.y, mo = mi.mo, monthName = mi.name;

    // Xodimning o'z oyi
    var days = arr(d.d), tasks = arr(d.t);
    if (days) {
      days = days.filter(function (r) { return Array.isArray(r) && num(r[0]) >= 1 && num(r[0]) <= 31; }).slice(-31);
      var lateSum = 0, came = 0, today = 0;
      days.forEach(function (r) { if (r[1]) came++; lateSum += num(r[3]); today = Math.max(today, num(r[0])); });
      // Bot jami qiymatlarni alohida yuborsa (ro'yxat qisqartirilgan bo'lishi mumkin), o'shalar ishlatiladi
      $('sDays').textContent = d.c != null ? num(d.c) : came;
      $('sLate').textContent = d.l != null ? num(d.l) : lateSum;
      $('sOpen').textContent = d.o != null ? num(d.o) : (tasks || []).filter(function (t) { return Array.isArray(t) && !t[3]; }).length;
      $('worker').hidden = false;
      $('monthTitle').textContent = monthName || 'Oy';
      var tb = $('days');
      days.slice().reverse().forEach(function (r) {
        var dn = num(r[0]), late = num(r[3]);
        var tr = el('tr', r[4] ? 'off' : null);
        var dc = td('day t', String(dn));
        if (mm) dc.appendChild(el('span', 'wd', WD[new Date(Date.UTC(y, mo - 1, dn)).getUTCDay()]));
        tr.appendChild(dc);
        tr.appendChild(td('t' + (r[1] ? '' : ' dim'), r[1] ? str(r[1]) : '—'));
        tr.appendChild(td('t' + (r[2] ? '' : ' dim'), r[2] ? str(r[2]) : '—'));
        // holat: dam olish (kulrang), kechikish (sariq), o'tgan kunda kelmagan (qizil); bugun hali kelmagan - rangsiz
        var st = r[4] ? tag(null, 'dam olish') : late > 0 ? tag('warn', '+' + late + ' daq') : (!r[1] && dn < today) ? tag('no', 'kelmagan') : null;
        tr.appendChild(st ? cell('r', st) : td('r', ''));
        tb.appendChild(tr);
      });
      var dMore = num(d.dn) - days.length;
      if (dMore > 0) $('monthBox').appendChild(el('p', 'more', 'yana ' + dMore + ' ta oldingi kun sig\'madi (jami yuqorida hisoblangan)'));
      $('monthBox').hidden = false;
    }
    if (tasks) {
      var box = $('tasks');
      tasks = tasks.filter(Array.isArray);
      if (!tasks.length) box.appendChild(el('p', 'empty', "Hozircha topshiriq yo'q."));
      tasks.forEach(function (t) { box.appendChild(taskRow(t, null, true)); });
      more(box, num(d.tn) - tasks.length, 'topshiriq');
      $('tasksBox').hidden = false;
    }
    // Egasi: hamma xodimlar bugun va oy bo'yicha. Hali kelmagan xodim rangsiz (vaqti o'tmagan bo'lishi mumkin).
    var team = arr(d.s);
    if (team) {
      var tt = $('team');
      team.filter(Array.isArray).forEach(function (r) {
        // r = [ism, keldi, ketdi, bugun kechikish, oyda kelgan kun, oyda kechikish daq, bugun dam olish 0/1]
        var late = num(r[3]);
        var tr = el('tr', r[6] ? 'off' : null);
        tr.appendChild(td('name', str(r[0])));
        var inn;
        if (r[1]) { inn = el('td', 't', str(r[1])); if (late > 0) { inn.appendChild(document.createTextNode(' ')); inn.appendChild(tag('warn', '+' + late)); } }
        else inn = r[6] ? cell(null, tag(null, 'dam')) : td('t dim', '—');
        tr.appendChild(inn);
        tr.appendChild(td('t' + (r[2] ? '' : ' dim'), r[2] ? str(r[2]) : '—'));
        var oy = el('td', 'r t', num(r[4]) + ' kun');
        if (num(r[5]) > 0) oy.appendChild(el('div', 'muted', num(r[5]) + ' daq kech'));
        tr.appendChild(oy);
        tt.appendChild(tr);
      });
      more($('teamBox'), num(d.sn) - team.length, 'xodim');
      $('teamBox').hidden = false;
    }
    var ot = arr(d.ot);
    if (ot) {
      var tbx = $('teamTasks');
      ot = ot.filter(Array.isArray);
      $('otCnt').textContent = String(d.on != null ? num(d.on) : ot.length);
      if (!ot.length) tbx.appendChild(el('p', 'empty', "Ochiq topshiriq yo'q."));
      ot.forEach(function (t) { tbx.appendChild(taskRow([t[0], t[2], t[3], 0], str(t[1]), false)); });
      more(tbx, num(d.on) - ot.length, 'ochiq topshiriq');
      $('teamTasksBox').hidden = false;
    }
  }

  // ======================= v2 (bot v14, ILOVA-V2-SHARTNOMA.md) =======================
  var KEY = { kty: 'EC', crv: 'P-256', x: 'Foly2aHl4Ysb4fvLycI0rBi9iX2V9kwqUedrzDDL0mc', y: 's-SLlPsoGOOdHOLK6Ng5hDiQpZolYnGSIfklZcj9lLA' };
  var NO_MENU = 'Bu amal uchun sahifani chat pastidagi menyu tugmasidan oching.';
  var SENT = 'Yuborildi, bot chatda tasdiqlaydi';
  var HM = /^([01]\d|2[0-3]):[0-5]\d$/;
  var V = null; // v2 ma'lumoti

  function b64u(bytes) {
    var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function pubKey() {
    // Test kaliti faqat mahalliy testda (127.0.0.1) o'qiladi; boshqa hamma joyda shartnoma kaliti
    var t = window.__MC_TEST_PUB;
    return (t && typeof t === 'object' && location.hostname === '127.0.0.1') ? t : KEY;
  }
  // ECDH P-256 (bir martalik kalit) + HKDF-SHA256 (bo'sh salt, info mc-app-v1) + AES-256-GCM, iv 12 bayt.
  // Natija: base64url(eph_pub_raw[65] | iv[12] | ciphertext+tag). Saytdagi mcEncrypt bilan bir xil, faqat info boshqa.
  async function encrypt(plain) {
    var subtle = crypto.subtle;
    var botKey = await subtle.importKey('jwk', pubKey(), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    var eph = await subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    var shared = await subtle.deriveBits({ name: 'ECDH', public: botKey }, eph.privateKey, 256);
    var hk = await subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    var aes = await subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('mc-app-v1') },
      hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv: iv }, aes, new TextEncoder().encode(plain)));
    var pub = new Uint8Array(await subtle.exportKey('raw', eph.publicKey));
    var out = new Uint8Array(pub.length + iv.length + ct.length);
    out.set(pub, 0); out.set(iv, pub.length); out.set(ct, pub.length + iv.length);
    return b64u(out);
  }
  function nonce() { return b64u(crypto.getRandomValues(new Uint8Array(18))); } // 24 belgi
  // Manzil sahifaga qattiq yozilgan: URL (# qismi) ichidagi topic yoki serverga hech qachon ishonilmaydi (soxta havola amallarni boshqa joyga yubormasin)
  var ENDPOINT = 'https://ntfy.sh/mc-vnoo2calnbwnobjxncz6hd3y';
  function endpoint() { return ENDPOINT; }
  function say(box, text, bad) { if (!box) return; box.textContent = text || ''; box.className = 'amsg' + (bad ? ' bad' : ''); }
  // Bitta amalni yuborish. ok() - muvaffaqiyatdan keyingi optimistik o'zgarish.
  async function act(a, btn, box, ok) {
    say(box, '');
    if (!INIT) { say(box, NO_MENU, true); return false; }
    btn.disabled = true;
    try {
      var body = 'ma1 ' + await encrypt(JSON.stringify({ v: 1, i: INIT, n: nonce(), a: a }));
      if (new TextEncoder().encode(body).length >= 4000) throw new Error('xabar juda uzun, matnni qisqartiring');
      var r = await fetch(endpoint(V), { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' }, cache: 'no-store', credentials: 'omit' });
      if (!r.ok) throw new Error('server javobi ' + r.status);
    } catch (e) {
      btn.disabled = false;
      say(box, "Yuborib bo'lmadi: " + str(e && e.message ? e.message : e) + ". Qayta urinib ko'ring.", true);
      return false;
    }
    say(box, SENT);
    if (ok) try { ok(); } catch (e) {}
    return true;
  }
  // v16: manzilida ma'lumot yo'q (chat ro'yxatidagi "Ochish" yoki qadalgan xabar tugmasi): ma'lumot botdan so'raladi.
  // Sahifa bir martalik kalit va tasodifiy javob topic'ini yaratadi, 'get' amalini yuboradi; bot javobni shu kalitga
  // shifrlab (HKDF info mc-app-get-v1) o'sha topic'ga qo'yadi. Javob ichida #z= qatori, u odatdagidek ochiladi.
  var NTFY = ENDPOINT.slice(0, ENDPOINT.lastIndexOf('/'));
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function openReply(kp, msg) {
    var subtle = crypto.subtle, raw = b64bytes(msg);
    if (raw.length < 65 + 12 + 17 || raw.length > 6000) return null;
    var bk = await subtle.importKey('raw', raw.slice(0, 65), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    var shared = await subtle.deriveBits({ name: 'ECDH', public: bk }, kp.privateKey, 256);
    var hk = await subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    var aes = await subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('mc-app-get-v1') },
      hk, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(65, 77) }, aes, raw.slice(77));
    var zs = new TextDecoder('utf-8', { fatal: true }).decode(pt);
    return /^[A-Za-z0-9_-]{1,8000}$/.test(zs) ? zs : null;
  }
  async function fetchLive() {
    var subtle = crypto.subtle;
    var kp = await subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    var pub = new Uint8Array(await subtle.exportKey('raw', kp.publicKey));
    var topic = 'mc-r-' + b64u(crypto.getRandomValues(new Uint8Array(18)));
    var since = Math.floor(Date.now() / 1000) - 10;
    var body = 'ma1 ' + await encrypt(JSON.stringify({ v: 1, i: INIT, n: nonce(), a: { t: 'get', k: b64u(pub), r: topic } }));
    var r = await fetch(endpoint(), { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' }, cache: 'no-store', credentials: 'omit' });
    if (!r.ok) throw new Error('post');
    var until = Date.now() + 30000;
    while (Date.now() < until) {
      await wait(1200);
      var txt = '';
      try {
        var g = await fetch(NTFY + '/' + topic + '/json?poll=1&since=' + since, { cache: 'no-store', credentials: 'omit' });
        if (!g.ok) continue;
        txt = await g.text();
      } catch (e) { continue; }
      if (txt.length > 50000) throw new Error('big');
      var lines = txt.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var ev; try { ev = JSON.parse(lines[i]); } catch (e) { continue; }
        if (!ev || ev.event !== 'message' || typeof ev.message !== 'string' || ev.message.indexOf('mr1 ') !== 0) continue;
        var zs = null; try { zs = await openReply(kp, ev.message.slice(4)); } catch (e) { zs = null; }
        if (zs) return decodeZ(zs);
      }
    }
    throw { timeout: 1 };
  }

  function doneV2(id, row, btn, txt) {
    if (!INIT) return done(id, row, btn); // klaviatura tugmasi: v1 dagidek sendData

      act(x, b, msg, function () { b.disabled = false; });
    });
  }

  // --- xodim: Yo'riqnoma (statik) ---
  function guidePanel(d) {
    var rad = d.cfg && typeof d.cfg === 'object' ? num(d.cfg.r) : 0;
    var s = sec('Kelish va ketishni belgilash'), ol = el('ol', 'guide');
    function li(parts) { var l = el('li'); parts.forEach(function (x) { l.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); }); ol.appendChild(l); }
    li(['Botda ', el('b', null, '✅ Keldim'), ' tugmasini bosing.']);
    li(['Chiqqan ', el('b', null, '📍 Joylashuvni yuborish'), ' tugmasini bosing. ' +
      (rad ? "Do'kondan " + rad + " m ichida bo'lishingiz kerak." : "Do'kon yonida bo'lishingiz kerak.")]);
    li([el('b', null, '🏁 Ketdim'), ' ham xuddi shunday: tugma, keyin joylashuv.']);
    s.appendChild(ol);
    s.appendChild(el('p', 'more', 'Bot har bir qadamdan keyin chatda javob beradi. Javob kelmasa, botga /start yozing.'));
    s.id = 'guide'; $('p-guide').appendChild(s);
  }

  function setupTabs(tabs) {
    var nav = $('tabs');
    var all = ['p-mine', 'p-today', 'p-orders', 'p-staff', 'p-report', 'p-settings', 'p-guide'];
    function show(id) {
      all.forEach(function (p) { $(p).hidden = p !== id; });
      Array.prototype.forEach.call(nav.children, function (b) { b.setAttribute('aria-selected', String(b.dataset.p === id)); });
      window.scrollTo(0, 0);
    }
    if (tabs.length > 1) {
      tabs.forEach(function (t) {
        var b = btn(t[1]); b.dataset.p = t[0]; b.setAttribute('role', 'tab'); b.id = 'tab-' + t[0].slice(2);
        if (t[2]) b.appendChild(el('span', 'tc', t[2]));
        b.addEventListener('click', function () { show(t[0]); });
        nav.appendChild(b);
      });
      nav.hidden = false; document.body.classList.add('has-tabs');
    }
    show(tabs[0][0]);
  }

  function renderV2(d) {
    V = d; doneFn = doneV2;
    if (d.r === 'o') {
      header(d);
      ownerToday(d);
      var nNew = ordersPanel(d, d.o);
      staffPanel(d); reportPanel(d); settingsPanel(d);
      setupTabs([['p-today', 'Bugun'], ['p-orders', 'Buyurtmalar', nNew ? nNew + ' yangi' : ''], ['p-staff', 'Xodimlar'], ['p-report', 'Hisobot'], ['p-settings', 'Sozlamalar']]);
    } else {
      var mine = {}; Object.keys(d).forEach(function (k) { mine[k] = d[k]; });
      delete mine.s; delete mine.ot; delete mine.ol; // xodimda bular jamoa jadvali emas
      render(mine);
      var tabs = [['p-mine', 'Mening ishim']];
      if (Number(d.ot) === 1) { var nn = ordersPanel(d, d.ol); tabs.push(['p-orders', 'Buyurtmalar', nn ? nn + ' yangi' : '']); }
      guidePanel(d); tabs.push(['p-guide', "Yo'riqnoma"]);
      setupTabs(tabs);
    }
  }

  function noData() { fail(inTg ? "Ma'lumot topilmadi. Botga /start yozib, tugmani qayta bosing." : 'Bu sahifa faqat Mercedes Center botidagi "📊 Mening ishim" tugmasidan ochiladi.'); }
  var hasData = /[#&][zd]=/.test(window.__mcHash || String(location.hash || ''));
  var loading = null;
  if (!hasData && INIT && window.crypto && crypto.subtle) { loading = el('p', 'more', 'Yuklanmoqda…'); loading.id = 'loading'; document.body.insertBefore(loading, document.body.firstChild); }
  (loading ? fetchLive() : decode()).then(function (d) {
    if (loading) loading.remove();
    if (!d || typeof d !== 'object' || (d.v !== 1 && d.v !== 2)) return noData();
    try { if (d.v === 2) renderV2(d); else render(d); }
    catch (e) {
      hideAll(); ['p-today', 'p-orders', 'p-staff', 'p-report', 'p-settings', 'p-guide'].forEach(function (k) { $(k).hidden = true; });
      $('tabs').hidden = true; document.body.classList.remove('has-tabs');
      fail("Ma'lumotni ko'rsatib bo'lmadi. Botga /start yozib, tugmani qayta bosing.");
    }
  }, function (e) {
    if (loading) loading.remove();
    if (e && e.upd) fail('Telegram ilovasini yangilang');
    else if (loading) fail("Bot javob bermadi. Biroz kutib, qayta oching. Bir necha marta takrorlansa, botga /start yozing.");
    else noData();
  });
})();
