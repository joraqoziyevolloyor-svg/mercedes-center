        (d.eg != null ? "Bot sizga shaxsiy chatda so'raydi: \"📦 Buyurtmalar\" ni bosing. Shundan keyin yangi buyurtmalar guruhga tushadi." : "Bot guruhga \"ulandi\" deb yozadi. Shundan keyin yangi buyurtmalar guruhga tushadi.")].forEach(function (t) { ol.appendChild(el('li', null, t)); });

  // --- egasi (v17): Eslatmalar ---
  // Qoida: [id, tur, daqiqa, yoqilgan, kimga (0 = hamma, aks holda xodim id), matn ('' = standart)]
  var RK = [['pre', 'Ish boshlanishidan oldin'], ['late', 'Ish boshlanganda / kechiksa'], ['boss', 'Kelmasa, menga xabar'], ['out', "Ish tugagach, \"Ketdim\" bosilmasa"]];
  var RDEF = {
    pre: '⏰ Ish soat {vaqt} da boshlanadi. Kelganingizda "✅ Keldim" ni bosing.',
    late: '⏰ Ish soat {vaqt} da boshlandi. Do\'konda bo\'lsangiz, "✅ Keldim" ni bosing.',
    boss: '⚠️ {ism} hali kelmadi (ish {vaqt} da boshlangan, {daq} daqiqa o\'tdi).',
    out: '🏁 Ish soat {vaqt} da tugadi. Ketayotganda "🏁 Ketdim" ni bosing.'
  };
  function remWhen(k, m) {
    if (k === 'pre') return m + ' daqiqa oldin';
    if (k === 'late') return m ? 'boshlanganidan ' + m + ' daqiqa keyin' : 'ish boshlanganda';
    if (k === 'boss') return m + ' daqiqa kechiksa, sizga';
    return m ? 'tugaganidan ' + m + ' daqiqa keyin' : 'ish tugaganda';
  }
  function remEditor(rule, team, onSaved) {
    var f = el('div', 'form');
    var k = el('select');
    RK.forEach(function (x) { var o = el('option', null, x[1]); o.value = x[0]; k.appendChild(o); });

    var m = input('number', rule ? String(rule.m) : '10', { min: '0', max: '180', step: '1', inputmode: 'numeric' });
    var w = el('select'), o0 = el('option', null, 'Hamma xodim'); o0.value = '0'; w.appendChild(o0);
    team.forEach(function (r) { var o = el('option', null, str(r[1])); o.value = String(sid(r[0])); w.appendChild(o); });
    w.value = rule && rule.w ? String(rule.w) : '0';
    if (w.value === '') { var og = el('option', null, "(o'chirilgan xodim)"); og.value = String(rule.w); w.appendChild(og); w.value = og.value; }
    var x = el('textarea'); x.maxLength = 160; x.value = rule ? rule.x : '';

    function ph() { x.placeholder = RDEF[k.value] || ''; cnt.textContent = x.value.length + " / 160. Bo'sh qolsa: standart matn. {ism}, {vaqt}, {daq} o'rniga qiymat qo'yiladi."; }

    var chk = el('label', 'chk'), cb = input('checkbox'); cb.checked = rule ? !!rule.on : true;
    chk.appendChild(cb); chk.appendChild(document.createTextNode('Yoqilgan'));
    var tf = field('Matn', x); tf.appendChild(cnt);
    f.appendChild(field('Qachon', k)); f.appendChild(field('Necha daqiqa', m, '0–180')); f.appendChild(field('Kimga', w, 'Bitta xodimga yozilgan eslatma unga umumiysining o\'rnini bosadi')); f.appendChild(tf); f.appendChild(chk);
    var acts = el('div', 'acts'), save = btn(rule ? 'Saqlash' : "Qo'shish", rule ? null : 'wide'), msg = el('p', 'amsg');
    acts.appendChild(save);
    var del = null;
    if (rule) { del = btn("O'chirish", 'danger'); acts.appendChild(del); }
    f.appendChild(acts); f.appendChild(msg);
    save.addEventListener('click', function () {
      var a = { t: 'rset', k: k.value, m: Number(m.value), on: cb.checked ? 1 : 0, w: sid(w.value), x: x.value.replace(/\s+/g, ' ').trim() };
      if (rule) a.id = rule.id;
      if (m.value === '' || !Number.isInteger(a.m) || a.m < 0 || a.m > 180) return say(msg, "Daqiqa 0–180 bo'lsin.", true);
      if (a.k === 'pre' && a.m < 1) return say(msg, "Oldin yuboriladigan eslatma kamida 1 daqiqa bo'lsin.", true);
      if (a.x.length > 160) return say(msg, '160 belgidan oshmasin.', true);
      act(a, save, msg, function () { if (rule) save.disabled = false; if (onSaved) onSaved(a); });
    });
    if (del) del.addEventListener('click', function () {
      ask("Eslatma o'chirilsinmi?", function (y) { if (y) act({ t: 'rdel', id: rule.id }, del, msg, function () { save.disabled = true; if (onSaved) onSaved(null); }); });
    });
    return f;
  }
  function remindPanel(d, p) {
    var team = staffRows(d).filter(function (r) { return !r[17]; }), names = {};
    team.forEach(function (r) { names[sid(r[0])] = str(r[1]); });

    if (!rules.length) s.appendChild(el('p', 'empty', "Eslatma yo'q."));
    rules.forEach(function (rule) {
      var wrap = el('div', 'ord'), head = btn(null, 'srow'); head.setAttribute('aria-expanded', 'false');

        if (!a) { wrap.classList.add('gone'); return; }
        rule.k = a.k; rule.m = a.m; rule.on = a.on; rule.w = a.w; rule.x = a.x; paint();
      }));
      head.addEventListener('click', function () { ed.hidden = !ed.hidden; head.setAttribute('aria-expanded', String(!ed.hidden)); wrap.classList.toggle('open', !ed.hidden); });
      wrap.appendChild(head); wrap.appendChild(ed); s.appendChild(wrap);
    });
    s.id = 'remList'; p.appendChild(s);
    var a = sec("Eslatma qo'shish");
    a.appendChild(remEditor(null, team, function () {}));
    a.id = 'remAdd'; p.appendChild(a);
  }

  // --- egasi (v17): Kirish huquqi ---
  function accessPanel(d, p) {
    var team = staffRows(d).filter(function (r) { return !r[17]; }), LV = lvList(d).filter(function (l) { return num(l[3]) !== 1; });
    var s = sec('Kirish huquqi', String(team.length));

      : "Botga faqat ro'yxatdagi raqamlar kira oladi. To'xtatilgan odamga bot javob bermaydi, tarixi saqlanadi. Boshqaruvchi mini ilovada Bugun, Buyurtmalar, Xodimlar va Hisobotni ko'radi; Admin bo'limi faqat sizda."));
    team.forEach(function (r) {
      var id = sid(r[0]), cur = { b: r[14] ? 1 : 0, p: r[15] ? 1 : 0, lv: sid(r[16]) };
      var wrap = el('div', 'ord'), head = btn(null, 'srow'); head.setAttribute('aria-expanded', 'false');
      var hr = el('span', 'hr'), sub = el('span', 'sub');
      head.appendChild(el('span', 'nm', str(r[1]))); head.appendChild(hr); head.appendChild(sub);
      function paint() {

        if (!r[13]) sub.appendChild(el('span', null, '· botga kirmagan'));
      }
      paint();
      var ed = el('div', 'sed'); ed.hidden = true;
      var f = el('div', 'form');
      var c1 = el('label', 'chk'), b1 = input('checkbox'); b1.checked = !cur.b; c1.appendChild(b1); c1.appendChild(document.createTextNode('Botdan foydalana oladi'));
      var c2 = el('label', 'chk'), b2 = input('checkbox'); b2.checked = !!cur.p; c2.appendChild(b2); c2.appendChild(document.createTextNode("Boshqaruv bo'limini ko'radi"));
      var lsel = el('select');
      LV.forEach(function (l) { var o = el('option', null, str(l[1])); o.value = String(sid(l[0])); lsel.appendChild(o); });
      if (LV.length) {
        var o0 = el('option', null, 'Lavozimni tanlang'); o0.value = ''; lsel.insertBefore(o0, lsel.firstChild);
        var known = LV.some(function (l) { return sid(l[0]) === cur.lv; }), def = LV.filter(function (l) { return num(l[3]) === 2; })[0];
        lsel.value = known ? String(cur.lv) : (!cur.lv && def ? String(sid(def[0])) : '');
      }
      var acts = el('div', 'acts'), save = btn('Saqlash'), del = btn("Ro'yxatdan o'chirish", 'danger'), msg = el('p', 'amsg');
      acts.appendChild(save); acts.appendChild(del);
      f.appendChild(c1); f.appendChild(LV.length ? field('Lavozim', lsel, "Lavozim huquqlari: Admin → Sozlamalar → Lavozimlar") : c2); f.appendChild(acts); f.appendChild(msg);
      ed.appendChild(f);
      head.addEventListener('click', function () { ed.hidden = !ed.hidden; head.setAttribute('aria-expanded', String(!ed.hidden)); wrap.classList.toggle('open', !ed.hidden); });
      save.addEventListener('click', function () {
        if (LV.length && !sid(lsel.value)) return say(msg, 'Lavozimni tanlang.', true);
        var a = LV.length ? { t: 'acc', sid: id, b: b1.checked ? 0 : 1, lv: sid(lsel.value) } : { t: 'acc', sid: id, b: b1.checked ? 0 : 1, p: b2.checked ? 1 : 0 };
        act(a, save, msg, function () { cur = { b: a.b, p: a.p ? 1 : 0, lv: a.lv || cur.lv }; paint(); save.disabled = false; });
      });
      del.addEventListener('click', function () {
        ask(str(r[1]) + " ro'yxatdan o'chirilsinmi?", function (y) {
          if (y) act({ t: 'sdel', sid: id }, del, msg, function () { wrap.classList.add('gone'); save.disabled = true; });
        });
      });
      wrap.appendChild(head); wrap.appendChild(ed); s.appendChild(wrap);
    });
    if (!team.length) s.appendChild(el('p', 'empty', "Xodim yo'q."));
    s.id = 'accList'; p.appendChild(s);

    // rebuild 7 (v20): faqat nik bilan qo'shilgan, hali raqamini yubormaganlar
    var pu = (arr(d.pu) || []).filter(Array.isArray);
    if (pu.length) {
      var q = sec('Nik bilan qo\'shilganlar', String(pu.length));
      q.appendChild(el('p', 'more', "Bu odamlar botni ochib raqamini yuborgach oddiy xodim bo'ladi."));
      pu.forEach(function (x) {
        var pid = sid(x[0]); if (!pid) return;
        var row = el('div', 'form'), line = el('p', null, (str(x[1]) || '—') + ' · @' + str(x[2]) + ' · ' + (x[3] ? "botni ochgan, raqam kutilmoqda" : 'botni hali ochmagan'));
        var b = btn("Ro'yxatdan o'chirish", 'danger'), msg = el('p', 'amsg');
        row.appendChild(line); row.appendChild(b); row.appendChild(msg); q.appendChild(row);
        b.addEventListener('click', function () {
          ask(str(x[1]) + " ro'yxatdan o'chirilsinmi?", function (y) { if (y) act({ t: 'sdel', sid: pid }, b, msg, function () { row.classList.add('gone'); }); });
        });
      });
      q.id = 'nikList'; p.appendChild(q);
    }

    // Ro'yxatda yo'q raqam bilan kirmoqchi bo'lganlar (oxirgi 7 kun)
    var jt = (arr(d.jt) || []).filter(Array.isArray);
    if (!jt.length) return;
    var j = sec('Kirmoqchi bo\'lganlar', String(jt.length));
    jt.forEach(function (x) {
      var ph = phoneFmt(x[1]);
      if (!ph) return;
      var row = el('div', 'form'), line = el('p', null, (str(x[0]) || '—') + ' · ' + ph.text + ' · ' + str(x[2]));
      var b = btn('Xodim qilib qo\'shish'), msg = el('p', 'amsg');
      row.appendChild(line); row.appendChild(b); row.appendChild(msg); j.appendChild(row);
      b.addEventListener('click', function () {
        var name = cap(x[0], 40) || 'Xodim';
        act({ t: 'sadd', name: name, phone: str(x[1]).replace(/\D/g, ''), st: '09:00', en: '18:00', off: 0 }, b, msg, function () {
          say(msg, SENT + ". Ish vaqtini Xodimlar bo'limida o'zgartirasiz.");
        });
      });
    });
    j.id = 'joinList'; p.appendChild(j);
  }

  // --- xodim: Yo'riqnoma (statik) ---
  function guidePanel(d) {

      li(['Xabar yozish joyi yonidagi ', el('b', null, '📎'), ' → ', el('b', null, 'Joylashuv'), ' → ', el('b', null, 'Jonli joylashuvni ulashish'), ' (15 daqiqa). ' +
        (rad ? "Do'kondan " + rad + " m ichida bo'lishingiz kerak." : "Do'kon yonida bo'lishingiz kerak.")]);
      li(["Bot \"Qabul qilindi\" deydi. Shundan keyin jonli joylashuvni to'xtatsangiz bo'ladi."]);
    } else {
      li(['Chiqqan ', el('b', null, '📍 Joylashuvni yuborish'), ' tugmasini bosing. ' +

  }

  var TAB_ICON = { 'p-mine': '🗓', 'p-today': '📋', 'p-orders': '📦', 'p-staff': '👥', 'p-report': '📊', 'p-settings': '⚙️', 'p-guide': '❔' };
  function setupTabs(tabs) {
    var nav = $('tabs');
    var all = ['p-mine', 'p-today', 'p-orders', 'p-staff', 'p-report', 'p-settings', 'p-guide'];
    function show(id) {
      CUR_TAB = id;
      all.forEach(function (p) { $(p).hidden = p !== id; });
      Array.prototype.forEach.call(nav.children, function (b) { b.setAttribute('aria-selected', String(b.dataset.p === id)); });
      window.scrollTo(0, 0);
    }
    if (tabs.length > 1) {
      tabs.forEach(function (t) {
        var b = btn(null); b.dataset.p = t[0]; b.setAttribute('role', 'tab'); b.id = 'tab-' + t[0].slice(2);
        // v17: katta belgi + nom (telefonda bosish oson)
        b.appendChild(el('span', 'ti', TAB_ICON[t[0]] || '•')); b.appendChild(document.createTextNode(t[1]));
        if (t[2]) b.appendChild(el('span', 'tc new', t[2]));
        b.addEventListener('click', function () { show(t[0]); });
        nav.appendChild(b);
      });
      nav.hidden = false; document.body.classList.add('has-tabs');
    }
    // rebuild 9: o'zi yangilanganda avvalgi bo'lim va joy saqlanadi
    var keep = ss('mc-tab'), y = Number(ss('mc-y')) || 0; ss('mc-tab', null); ss('mc-y', null);
    show(keep && tabs.some(function (t) { return t[0] === keep; }) ? keep : tabs[0][0]);
    if (keep && y > 0) window.scrollTo(0, y);
  }

  function renderV2(d) {
    V = d; doneFn = doneV2;
    BOT17 = !!(d.cfg && typeof d.cfg === 'object' && typeof d.cfg.lm === 'string');
    if (d.r === 'o') {
      ADM = d.adm !== 0; // v16 bot adm yubormaydi: u faqat egasiga egasi ma'lumotini berardi
      header(d);
      ownerToday(d);
      var nNew = ordersPanel(d, d.o);
      staffPanel(d); reportPanel(d);
      var tabs = [['p-today', 'Bugun'], ['p-orders', 'Buyurtmalar', nNew ? nNew + ' yangi' : ''], ['p-staff', 'Xodimlar'], ['p-report', 'Hisobot']];
      if (ADM) { settingsPanel(d); tabs.push(['p-settings', 'Admin']); }
      setupTabs(tabs);
    } else {
      var mine = {}; Object.keys(d).forEach(function (k) { mine[k] = d[k]; });
      delete mine.s; delete mine.ot; delete mine.ol; // xodimda bular jamoa jadvali emas
      render(mine);
      var tabs = [['p-mine', 'Mening ishim']];
      if (Number(d.ot) === 1) { var nn = ordersPanel(d, d.ol); tabs.push(['p-orders', 'Buyurtmalar', nn ? nn + ' yangi' : '']); }
      guidePanel(d); tabs.push(['p-guide', "Yo'riqnoma"]);
      setupTabs(tabs);
    }
  }

  function noData() { fail(inTg ? "Ma'lumot topilmadi. Botga /start yozib, tugmani qayta bosing." : 'Bu sahifa faqat Mercedes Center botidagi "📊 Mening ishim" tugmasidan ochiladi.'); }
  var hasData = /[#&][zd]=/.test(window.__mcHash || String(location.hash || ''));
  var loading = null;
  if (!hasData && INIT && window.crypto && crypto.subtle) { loading = el('p', 'more', 'Yuklanmoqda…'); loading.id = 'loading'; document.body.insertBefore(loading, document.body.firstChild); }
  (loading ? fetchLive() : decode()).then(function (d) {
    if (loading) loading.remove();
    if (!d || typeof d !== 'object' || (d.v !== 1 && d.v !== 2)) return noData();
    try { if (d.v === 2) renderV2(d); else render(d); if (d.v === 2) startAutoRefresh(d); }
    catch (e) {
      hideAll(); ['p-today', 'p-orders', 'p-staff', 'p-report', 'p-settings', 'p-guide'].forEach(function (k) { $(k).hidden = true; });
      $('tabs').hidden = true; document.body.classList.remove('has-tabs');
      fail("Ma'lumotni ko'rsatib bo'lmadi. Botga /start yozib, tugmani qayta bosing.");
    }
  }, function (e) {
    if (loading) loading.remove();
    if (e && e.upd) fail('Telegram ilovasini yangilang');
    else if (loading) fail("Bot javob bermadi. Biroz kutib, qayta oching. Bir necha marta takrorlansa, botga /start yozing.");
    else noData();
  });
})();
