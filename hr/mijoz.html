<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-4azWAxb6HKiEPUjdDYj0tmKh8DC2/uneLFy43HEyNUM=' 'sha256-iRap8dA84UGb6DktS6cMG6XM/GQOV4EbrfKNh11jX0E='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Mening hisobim</title>
<!-- Telegram skripti hash oxiriga &tgWebApp… qo'shadi — asl hash'ni undan OLDIN saqlaymiz -->
<script>window.__mjHash = String(location.hash || '');</script>
<!-- Telegram WebApp skriptining shu papkadagi qotirilgan nusxasi (telegram-web-app.js, sha256 hr-bot/miniapp/TELEGRAM-WEB-APP.md da) -->
<script src="telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #fff); --fg: var(--tg-theme-text-color, #1b2429); --muted: var(--tg-theme-hint-color, #6b7780);
          --card: var(--tg-theme-secondary-bg-color, #f1f4f6); --btn: var(--tg-theme-button-color, #0f6e8c); --btn-fg: var(--tg-theme-button-text-color, #fff);
          --link: var(--tg-theme-link-color, #0f6e8c); --bad: #c0392b; --good: #1e8449; --line: color-mix(in srgb, var(--muted) 25%, transparent); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: var(--tg-theme-bg-color, #17212b); --fg: var(--tg-theme-text-color, #f5f5f5); --muted: var(--tg-theme-hint-color, #8b9aa7);
            --card: var(--tg-theme-secondary-bg-color, #232e3c); --btn: var(--tg-theme-button-color, #5288c1); --link: var(--tg-theme-link-color, #6ab3f3);
            --bad: #ff6b5e; --good: #4cd17a; }
  }
  html.dark { --bad: #ff6b5e; --good: #4cd17a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  main { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; overflow-wrap: anywhere; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; }
  .bal { text-align: center; padding: 18px 12px; }
  .bal .lbl { font-size: 15px; font-weight: 600; }
  .bal .sum { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; }
  .bal.neg { color: var(--bad); } .bal.pos { color: var(--good); } .bal.zero .sum { font-size: 26px; }
  .call { display: block; text-align: center; text-decoration: none; border-radius: 10px; padding: 12px; font-weight: 600; background: var(--btn); color: var(--btn-fg); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; position: sticky; top: 0; z-index: 2; }
  .tabs button { appearance: none; border: 0; border-radius: 9px; padding: 9px 6px; font: inherit; font-size: 14px; font-weight: 600; background: transparent; color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--btn); color: var(--btn-fg); }
  .tabs .cnt { display: block; opacity: .75; font-weight: 500; font-size: 12px; }
  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .rc { border-bottom: 1px solid var(--line); }
  .rc:last-child { border-bottom: 0; }
  .rc > button { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; width: 100%; padding: 11px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .rc .l { flex: 1; min-width: 0; }
  .rc .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rc .tot { font-weight: 600; }
  .rc .debt { color: var(--bad); font-size: 13px; }
  .rc .chev { color: var(--muted); font-size: 18px; width: 12px; text-align: center; }
  .lines { padding: 0 12px 10px; }
  .ln { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .ln .nm { overflow-wrap: anywhere; }
  .ln .calc { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
  .ln .calc b { color: var(--fg); font-weight: 600; }
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 16px; }
  .search:focus { outline: 2px solid var(--btn); outline-offset: -1px; border-color: transparent; }
  .search::placeholder { color: var(--muted); }
  .pr { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .pr:last-child { border-bottom: 0; }
  .pr .l { flex: 1; min-width: 0; }
  .pr .nm { overflow-wrap: anywhere; }
  .pr .r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pr .price { font-weight: 600; }
  .empty { padding: 16px 12px; text-align: center; }
  .bad { color: var(--bad); font-weight: 600; }
  .err { text-align: center; padding: 24px 16px; }
  .err .ico { font-size: 40px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="err" class="card err" hidden>
    <div class="ico">⚠️</div>
    <p class="bad" style="margin-top:6px">Ma'lumotni ochib bo'lmadi</p>
    <p class="muted" style="margin-top:6px">Telegram'ni yangilang yoki botdagi 💰 Qarzim tugmasini bosing</p>
  </div>
  <div id="app" hidden style="display:contents">
    <div>
      <h1 id="name"></h1>
      <p class="muted" id="upd"></p>
    </div>
    <section id="bal" class="card bal"><div class="lbl" id="balLbl"></div><div class="sum" id="balSum"></div></section>
    <a id="call" class="call" href="tel:+998505220008">📞 Do'konga qo'ng'iroq</a>
    <div class="tabs" role="tablist">
      <button id="tabT" role="tab" aria-selected="true">🧾 Xaridlar <span class="cnt" id="cntT"></span></button>
      <button id="tabP" role="tab" aria-selected="false">🏷 Mening narxlarim <span class="cnt" id="cntP"></span></button>
    </div>
    <section id="paneT"><div class="list" id="rcs"></div></section>
    <section id="paneP" hidden>
      <input id="q" class="search" type="search" placeholder="Nomi yoki kodi bo'yicha qidirish" autocomplete="off">
      <p class="muted" id="found" style="margin:8px 2px"></p>
      <div class="list" id="prs"></div>
    </section>
    <p class="muted">Ma'lumot bot tugmani yuborgan paytdagi holat. Yangilash uchun botdagi 💰 Qarzim tugmasini qayta bosing.</p>
  </div>
</main>
<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  if (tg) {
    try { tg.ready(); tg.expand(); if (tg.colorScheme === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
  function num(x) { x = Number(x); return isFinite(x) ? x : 0; }
  // 1445.2 → "1 445,20"
  function money(x) {
    x = Math.abs(num(x));
    var s = x.toFixed(2), p = s.split('.');
    return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + p[1];
  }
  function usd(x) { return (num(x) < 0 ? '−' : '') + '$' + money(x); }
  function qty(x) { x = num(x); var s = String(Math.round(x * 1000) / 1000).replace('.', ','); return s; }
  function str(x) { return x == null ? '' : String(x); }

  var MAX_HASH = 4000, MAX_OUT = 64 * 1024;
  function showError() { $('app').hidden = true; $('err').hidden = false; }

  function decode() {
    var h = window.__mjHash || String(location.hash || '');
    var m = h.match(/^#z([A-Za-z0-9_-]+)(?:[&?]|$)/);
    if (!m) return Promise.reject(new Error('no hash'));
    // Telegram qo'shgan &tgWebApp… qismi hisobga kirmaydi — faqat bizning z-ma'lumot
    if (m[0].length > MAX_HASH) return Promise.reject(new Error('hash too long'));
    if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('no DecompressionStream'));
    var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    var reader = stream.getReader(), chunks = [], total = 0;
    function pump() {
      return reader.read().then(function (res) {
        if (res.done) {
          var all = new Uint8Array(total), off = 0;
          chunks.forEach(function (c) { all.set(c, off); off += c.length; });
          return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(all));
        }
        total += res.value.length;
        if (total > MAX_OUT) { try { reader.cancel().catch(function () {}); } catch (e) {} throw new Error('too big'); }
        chunks.push(res.value);
        return pump();
      });
    }
    return pump();
  }

  function receipt(t) {
    // [raqam, "kk.oo", jami, qarz, qatorlar]
    var lines = Array.isArray(t[4]) ? t[4] : [];
    var wrap = el('div', 'rc');
    var btn = el('button');
    btn.type = 'button';
    btn.setAttribute('aria-expanded', 'false');
    var l = el('div', 'l');
    l.appendChild(el('div', null, '№ ' + str(t[0])));
    l.appendChild(el('div', 'muted', str(t[1]) + (lines.length ? ' · ' + lines.length + ' xil tovar' : '')));
    var r = el('div', 'r');
    r.appendChild(el('div', 'tot', '$' + money(t[2])));
    if (num(t[3]) > 0) r.appendChild(el('div', 'debt', 'qarz $' + money(t[3])));
    btn.appendChild(l); btn.appendChild(r);
    var chev = el('span', 'chev', '›'); btn.appendChild(chev);
    wrap.appendChild(btn);
    var box = null;
    btn.addEventListener('click', function () {
      var open = !wrap.classList.contains('open');
      wrap.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      if (open && !box) {
        box = el('div', 'lines');
        if (!lines.length) box.appendChild(el('p', 'muted', "Tovarlar ro'yxati qisqartirilgan."));
        lines.forEach(function (ln) {
          // [sku, nom, miqdor, narx]
          var q = num(ln[2]), p = num(ln[3]);
          var d = el('div', 'ln');
          d.appendChild(el('div', 'nm', str(ln[1])));
          var c = el('div', 'calc');
          c.appendChild(el('span', null, qty(q) + ' × $' + money(p)));
          c.appendChild(el('b', null, '$' + money(q * p)));
          d.appendChild(c);
          box.appendChild(d);
        });
        wrap.appendChild(box);
      }
      if (box) box.hidden = !open;
      chev.textContent = open ? '⌄' : '›';
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    });
    return wrap;
  }

  function priceRow(p) {
    // [sku, nom, oxirgi narx, "kk.oo", necha marta]
    var row = el('div', 'pr');
    var l = el('div', 'l');
    l.appendChild(el('div', 'nm', str(p[1])));
    l.appendChild(el('div', 'muted', (p[0] ? 'Kod ' + str(p[0]) + ' · ' : '') + num(p[4]) + ' marta'));
    var r = el('div', 'r');
    r.appendChild(el('div', 'price', '$' + money(p[2])));
    r.appendChild(el('div', 'muted', str(p[3])));
    row.appendChild(l); row.appendChild(r);
    return row;
  }

  function render(d) {
    if (!d || typeof d !== 'object' || d.v !== 1) throw new Error('bad data');
    var T = Array.isArray(d.t) ? d.t : [], P = Array.isArray(d.p) ? d.p : [];
    $('name').textContent = str(d.n) || 'Mijoz';
    $('upd').textContent = "Ma'lumot: " + str(d.u) + ' holatiga';
    var b = Math.round(num(d.b) * 100) / 100, bal = $('bal');
    if (b < 0) { bal.className = 'card bal neg'; $('balLbl').textContent = 'Qarzingiz'; $('balSum').textContent = '$' + money(b); }
    else if (b > 0) { bal.className = 'card bal pos'; $('balLbl').textContent = 'Haqqingiz'; $('balSum').textContent = '$' + money(b); }
    else { bal.className = 'card bal zero'; $('balLbl').textContent = ''; $('balSum').textContent = "Qarz yo'q ✅"; }

    // Xaridlar — yangisi birinchi (bot shunday yuboradi; tartibni saqlaymiz)
    $('cntT').textContent = T.length + ' ta chek';
    var rcs = $('rcs');
    if (!T.length) rcs.appendChild(el('p', 'muted empty', "Hozircha xarid yo'q."));
    T.forEach(function (t) { if (Array.isArray(t)) rcs.appendChild(receipt(t)); });

    // Narxlar
    $('cntP').textContent = P.length + ' xil tovar';
    var prs = $('prs'), rows = [];
    P.forEach(function (p) {
      if (!Array.isArray(p)) return;
      var row = priceRow(p);
      rows.push({ el: row, key: (str(p[1]) + ' ' + str(p[0])).toLowerCase() });
      prs.appendChild(row);
    });
    var none = el('p', 'muted empty', P.length ? 'Hech narsa topilmadi.' : "Hozircha tovar yo'q.");
    none.hidden = P.length > 0; prs.appendChild(none);
    function filter() {
      var q = $('q').value.trim().toLowerCase(), n = 0;
      rows.forEach(function (r) { var ok = !q || r.key.indexOf(q) !== -1; r.el.hidden = !ok; if (ok) n++; });
      none.hidden = n > 0;
      $('found').textContent = q ? 'Topildi: ' + n + ' / ' + rows.length : 'Jami: ' + rows.length + ' xil tovar';
    }
    $('q').addEventListener('input', filter);
    if (!P.length) $('q').hidden = true;
    filter();

    function tab(which) {
      var t = which === 'T';
      $('tabT').setAttribute('aria-selected', String(t)); $('tabP').setAttribute('aria-selected', String(!t));
      $('paneT').hidden = !t; $('paneP').hidden = t;
    }
    $('tabT').addEventListener('click', function () { tab('T'); });
    $('tabP').addEventListener('click', function () { tab('P'); });
    $('app').hidden = false;
  }

  try {
    decode().then(render).catch(showError);
  } catch (e) { showError(); }
})();
</script>
</body>
</html>
