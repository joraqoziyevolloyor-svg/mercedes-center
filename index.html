<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mercedes Center: Porter, Bongo, Starex va Mercedes uchun avtozapchastlar.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mercedes Center do'koni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: parts-counter catalogue. Sticky header + search, car picker rail, dense product grid; OEM numbers set like part labels. Mobile bottom tab bar. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#131a22; --muted:#5d6874; --line:#dde1e6;
  --steel:#1d2a36; --steel-2:#2b3b4a; --accent:#f2a91d; --accent-ink:#1b1300;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --no:#b3261e; --no-bg:#fbe7e5; --tile:#e9ecef;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#171e24; --ink:#e8ecef; --muted:#9aa5ae; --line:#2a333b;
  --steel:#0a0f13; --steel-2:#1c2731; --accent:#f5b53a; --accent-ink:#1b1300;
  --ok:#5fd08e; --ok-bg:#15311f; --no:#ff8a80; --no-bg:#3a1917; --tile:#1f272e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#171e24; --ink:#e8ecef; --muted:#9aa5ae; --line:#2a333b;
  --steel:#0a0f13; --steel-2:#1c2731; --accent:#f5b53a; --accent-ink:#1b1300;
  --ok:#5fd08e; --ok-bg:#15311f; --no:#ff8a80; --no-bg:#3a1917; --tile:#1f272e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1760px;margin:0 auto;padding-inline:16px}
@media (min-width:1024px){.wrap{padding-inline:28px}}
.proto{background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:600;text-align:center;padding:6px 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel);color:#fff}
.top .row{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0;flex-shrink:0}
.logo .star{width:34px;height:34px}
.logo b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.logo small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:2px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:8px;border:1px solid transparent;background:var(--steel-2);color:#fff;padding:0 14px 0 40px}
.search input::placeholder{color:#9fb0bf}
.search svg{position:absolute;left:12px;top:11px;width:20px;height:20px;stroke:#9fb0bf}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;height:42px;padding:0 14px;font-weight:700;flex-shrink:0}
.cartbtn .n{background:var(--steel);color:#fff;border-radius:99px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
@media (max-width:720px){.top .row{gap:10px;padding-block:8px}.logo span{display:none}.logo .star{width:32px;height:32px}.cartbtn{display:none}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
@media (max-width:720px){nav.tabs{display:flex}}
@media (min-width:721px){body{padding-bottom:0}}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:26px;text-transform:uppercase}
.sec{padding-block:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.link{background:none;border:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0}

/* hero */
.hero{background:var(--steel);color:#fff;padding-block:18px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.035) 22px 23px);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;gap:14px}
@media (min-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr) auto;align-items:end}.hero .wrap>.full{grid-column:1/-1}}
.hero h1{font-size:clamp(26px,3.2vw,40px);line-height:1;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:#c3ceda;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:22px}
@media (max-width:720px){.stats{display:none}.hero .eyebrow{font-size:11px}}
.stats div{font-size:12.5px;color:#9fb0bf;text-transform:uppercase;letter-spacing:.08em}
.stats b{display:block;font-family:var(--f-display);font-size:26px;color:#fff;letter-spacing:0;font-variant-numeric:tabular-nums}
.carpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
@media (min-width:721px){.carpick{flex-wrap:wrap;overflow:visible}}
.carpick::-webkit-scrollbar{display:none}
.carpick button{flex-shrink:0;border:1px solid #3d4f60;background:var(--steel-2);color:#fff;border-radius:99px;padding:8px 14px;font-weight:500;font-size:14px}
.carpick button span{color:#9fb0bf;font-size:12px;margin-left:6px;font-variant-numeric:tabular-nums}
.carpick button:hover,.carpick button.on{border-color:var(--accent)}
.carpick button.on{background:var(--accent);color:var(--accent-ink)}
.carpick button.on span{color:var(--accent-ink)}
.sendbox{display:grid;gap:8px;width:100%}
a.big{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.big.tg{background:#2aabee;color:#fff}a.big.wa{background:#25d366;color:#08130c}
.brandline{display:none;font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.brandline span{display:block;margin-top:4px;font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--accent)}
@media (max-width:720px){.brandline{display:block}}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:600}
.bigsearch{display:flex;gap:8px;max-width:720px;min-width:0;width:100%;box-sizing:border-box}
@media (max-width:420px){.bigsearch button{padding:0 14px}}
.bigsearch input{flex:1;min-width:0;height:54px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:#131a22;padding:0 16px;font-size:17px;font-family:var(--f-mono)}
.bigsearch input::placeholder{font-family:var(--f-body);color:#6b7682}
.bigsearch button{height:54px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 20px;font-size:16px;flex-shrink:0}
.heroact{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.heroact span{color:#c3ceda;font-size:13.5px;max-width:40ch}
.big.ghost{background:transparent;color:#fff;border:1.5px solid #5b6d7e}
.quickbtn{margin-left:auto;background:none;border:1.5px solid #3d4f60;color:#fff;border-radius:8px;height:42px;padding:0 12px;font-weight:600;flex-shrink:0}
@media (max-width:720px){.quickbtn{display:none}}
.qo textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;font-family:var(--f-mono);font-size:14.5px;color:var(--ink);resize:vertical}
.qo .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.qres{display:grid;gap:8px;margin-top:18px}
.qrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 84px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.qrow.miss{border-style:dashed;background:transparent}
.qrow code{font-family:var(--f-mono);font-size:13px;word-break:break-all}
.qrow select,.qrow input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;width:100%;min-width:0;color:var(--ink)}
.qrow .none{color:var(--no);font-weight:600;font-size:13.5px}
@media (max-width:560px){.qrow{grid-template-columns:minmax(0,1fr) 72px}.qrow>div:nth-child(2){grid-column:1/-1;order:3}}
.qsum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:14px;font-weight:600}
.qsum .ok{color:var(--ok)}.qsum .no{color:var(--no)}
.qrow input.zero{border-color:var(--no);color:var(--no)}.zmsg{grid-column:1/-1;order:4;color:var(--no);font-size:12.5px;font-weight:600}
.qtyin{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-weight:600;color:var(--ink)}
.ordtext{width:100%;min-height:200px;font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px;resize:vertical}
.pickhead{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin-bottom:-8px}
.pickhead span{text-transform:none;letter-spacing:0;color:#c3ceda;font-weight:400}
.pickhead b{color:#fff}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cat:hover{border-color:var(--ink)}
.cat b{font-weight:600;font-size:14.5px}
.cat span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:1/1;background:#fff;display:block;width:100%;border:0;padding:0;position:relative;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:contain;padding:8px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.card .t{font-weight:600;font-size:14px;line-height:1.3;background:none;border:0;padding:0;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oem{font-family:var(--f-mono);font-size:12px;background:var(--tile);border-radius:4px;padding:1px 6px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:flex-start}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.pw{display:inline-flex;flex-direction:column;gap:2px}.ptag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);line-height:1}
.price{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.add{background:var(--steel);color:#fff;border:0;border-radius:8px;height:36px;min-width:36px;padding:0 10px;font-weight:600;display:flex;align-items:center;gap:6px}
.add svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.add[disabled]{background:var(--tile);color:var(--muted);cursor:not-allowed}
.add.in{background:var(--accent);color:var(--accent-ink)}
.ask{font-weight:600;font-size:13.5px;color:var(--ink);background:var(--tile);border-radius:6px;padding:4px 8px;white-space:nowrap}
.buy .ask{font-size:17px;padding:8px 12px}
.pill{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.no{color:var(--no);background:var(--no-bg)}
.card .ask{font-weight:600;font-size:13.5px;color:var(--ink);background:var(--tile);border-radius:6px;padding:4px 8px;white-space:nowrap}
.buy .ask{font-size:17px;padding:8px 12px}
.card .ph .pill{position:absolute;top:8px;left:8px}

/* placeholder label tile */
.ph.none{background:var(--tile)}
.lbl{position:absolute;inset:10px;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;color:var(--muted)}
.lbl svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.7}
.lbl i{font-style:normal;font-size:11.5px;line-height:1.25}
.lbl code{font-family:var(--f-mono);font-size:12px;color:var(--ink);word-break:break-all}

/* catalog */
.cat-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.cat-layout{grid-template-columns:minmax(0,1fr)}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:16px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.filters{position:static;display:none}.filters.open{display:grid}}
.toolbar{scroll-margin-top:72px}
.fclose{display:none}@media (max-width:900px){.fclose{display:block}}
.filters label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:grid;gap:6px}
.filters select,.filters input[type=text]{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;text-transform:none;letter-spacing:0;font-weight:400;font-size:14.5px;color:var(--ink);width:100%}
.chk{display:flex!important;grid-auto-flow:column;align-items:center;gap:8px!important;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--ink)!important;font-weight:500!important}
.chk input{width:18px;height:18px;accent-color:var(--steel)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:1;min-width:0}
.toolbar select{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px}
.fbtn{display:none;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-weight:600}
@media (max-width:900px){.fbtn{display:block}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--steel);color:#fff;border:0;border-radius:99px;padding:4px 10px 4px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.more{display:block;margin:20px auto 0;height:44px;padding:0 22px;border-radius:8px;border:1.5px solid var(--ink);background:none;font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}

/* product */
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:14px 4px}
.crumbs .back{text-decoration:none;background:var(--steel);color:#fff;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;margin-right:6px}
.catbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:12px}.catbar::-webkit-scrollbar{display:none}
.catbar button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
.catbar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (min-width:1024px){.catbar{flex-wrap:wrap;overflow:visible}}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.pd{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:28px;padding-block:14px 10px}
@media (max-width:800px){.pd{grid-template-columns:minmax(0,1fr);gap:16px}}
.pd .ph{background:#fff;border:1px solid var(--line);border-radius:var(--r);aspect-ratio:1/1;position:relative;max-width:100%}
.pd .ph img{width:100%;height:100%;object-fit:contain;padding:18px}
.pd .ph.none{background:var(--tile)}
.pd h1{font-size:clamp(26px,4vw,36px);line-height:1.05;text-transform:uppercase}
.pd .info{display:flex;flex-direction:column;gap:14px;min-width:0}
.pd .ru{color:var(--muted);font-size:14px;word-break:break-word}
.spec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.spec div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.spec div:first-child{border-top:0}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:500;word-break:break-word}
.copy{margin-left:6px;background:none;border:1px solid var(--line);border-radius:6px;font-size:11.5px;padding:1px 7px;color:var(--muted)}
.buy{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.buy .price{font-size:40px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);height:46px}
.qty button{width:40px;height:100%;background:none;border:0;font-size:20px}
.qty span{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.big{height:46px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 22px;font-size:15.5px}
.big.dark{background:var(--steel);color:#fff}
.big[disabled]{background:var(--tile);color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.note b{color:var(--ink)}

/* cart */
.cart{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;padding-block:10px 30px}
@media (max-width:860px){.cart{grid-template-columns:minmax(0,1fr)}}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.lines{display:grid;gap:8px}
.line .th{width:72px;height:72px;background:#fff;border-radius:8px;overflow:hidden;position:relative}
.line .th img{width:100%;height:100%;object-fit:contain;padding:4px}
.line .th.none{background:var(--tile);display:grid;place-items:center;color:var(--muted)}
.line .th.none svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.line .nm{font-weight:600;font-size:14px;line-height:1.3}
.line .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.line .qty{height:34px}.line .qty button{width:32px;font-size:17px}
.rm{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.summary .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.summary .tot .price{font-size:32px}
.field{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;font-weight:400;color:var(--ink);font-size:15px}
.field textarea{height:70px;padding:10px 12px;resize:vertical}
.field .err{color:var(--no);font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);cursor:pointer}
.seg label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.done{max-width:520px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center;display:grid;gap:12px;justify-items:center}
.done .ic{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.done .ic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.5}
.done h2{font-size:30px}
.ordno{font-family:var(--f-mono);font-size:18px;background:var(--tile);padding:4px 12px;border-radius:6px}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:22px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--steel);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
</style>

function urlFor(s){
  if (s.view==='product') return '#p/'+encodeURIComponent(s.id);
  if (s.view==='catalog'){ const u=new URLSearchParams(); ['q','car','cat','brand'].forEach(k=>{ if(s[k]) u.set(k,s[k]); }); if(s.stock) u.set('stock','1'); if(s.photo) u.set('photo','1'); const x=u.toString(); return '#c'+(x?'?'+x:''); }
  if (s.view==='quick'||s.view==='cart') return '#'+s.view;
  return location.pathname+location.search;
}
function fromUrl(){
  let h=location.hash.slice(1), m; try { h=decodeURIComponent(h); } catch(e) {}
  if ((m=h.match(/^p\/(.+)$/))) return {view:'product',id:m[1]};
  if (h==='c' || h.startsWith('c?')){ const u=new URLSearchParams(location.hash.slice(location.hash.indexOf('?')+1)); return {view:'catalog',q:u.get('q')||'',car:u.get('car')||'',cat:u.get('cat')||'',brand:u.get('brand')||'',stock:u.get('stock')==='1',photo:u.get('photo')==='1'}; }
  if (h==='quick'||h==='cart') return {view:h};
  return {view:'home'};
}
function go(view, extra={}){
  try { history.replaceState(snap(), ''); } catch(e) {}
  Object.assign(state, {view, limit:24, fopen:false, depth:(state.depth||0)+1}, extra);
  if (view!=='catalog' && view!=='product') state.q='';
  navigating=true; render(); navigating=false; window.scrollTo({top:0});
  try { history.pushState(snap(), '', urlFor(state)); } catch(e) {}
}
window.addEventListener('popstate', e => {
  const s = e.state && e.state.view ? e.state : {...fromUrl(), scroll:0, depth:(state.depth||0)+1, limit:24};
  Object.assign(state, s); navigating=true; render(); navigating=false;
  setTimeout(()=>{ scrollTo(0,s.scroll||0); try { history.replaceState(snap(), '', urlFor(state)); } catch(e) {} },0);
});

function filtered(){
  const raw = String(state.q||'').trim(), q = norm(raw);
  // Aniq OEM/kod topilsa, mashina filtri uni yashirmaydi; qisqa raqamli kod faqat aniq mos keladi
  const exact = new Set(q ? findCode(raw) : []);
  const words = raw.split(/\s+/).map(norm).filter(Boolean);
  const short = /^\d{1,4}$/.test(q);
  // Qisqa raqam (masalan dvigatel 133): aniq kod yoki nomdagi alohida so'z sifatida
  const wre = short ? new RegExp('(^|[^0-9a-zа-я])'+q+'($|[^0-9a-zа-я])','i') : null;
  const mq = p => !q || exact.has(p.id) || (short ? wre.test(p.name||'') : (p._s.includes(q) || (words.length>1 && words.every(w=>p._s.includes(w)))));
  // So'rovda mashina nomi bo'lsa (masalan "Колодка Porter"), eslab qolingan mashina qo'llanmaydi
  const named = words.some(w => CARS.some(([c]) => norm(c.split(' ')[0])===w || norm(c)===w));
  let r = P.filter(p => mq(p) && (!state.car || named || p.car===state.car || exact.has(p.id)) && (!state.cat || p.cat===state.cat)
    && (!state.brand || p.brand===state.brand) && (!state.stock || p.stock) && (!state.photo || p.img));
  const s = state.sort;
  const pv=(p,d)=>p.price??d;
  if (s==='cheap') r.sort((a,b)=>pv(a,1e9)-pv(b,1e9)); else if (s==='dear') r.sort((a,b)=>pv(b,-1)-pv(a,-1));
  else if (s==='name') r.sort((a,b)=>a.title.localeCompare(b.title,'ru'));
  else r.sort((a,b)=>(!a.img)-(!b.img) || (!a.stock)-(!b.stock));
  if (exact.size) r.sort((a,b)=>(!exact.has(a.id))-(!exact.has(b.id)));
  return r;
}

const CODE = {};
const addCode = (k,id) => { k=norm(k); if (k.length<3) return; const ks=[k];
  if (/^a\d{9,}$/.test(k)) ks.push(k.slice(1)); else if (/^\d{10,}$/.test(k)) ks.push('a'+k);  // Mercedes: A bilan va A siz
  ks.forEach(k=>{ (CODE[k]=CODE[k]||[]); if(!CODE[k].includes(id)) CODE[k].push(id); }); };
P.forEach(p => {
  [p.oem,p.size].forEach(v => String(v||'').split(/[,;]| \/ /).forEach(x => addCode(x,p.id)));
  (p.altc||[]).forEach(x => addCode(String(x).replace(/^(Murat|Asmetal)\s+/,''),p.id));
  (p.alto||[]).forEach(x => addCode(x,p.id));
  String(p.oem||'').split(/[,;]/).forEach(x=>{ x=x.trim(); if(x.includes('/')) x.split('/').forEach(y=>addCode(y,p.id)); });
  addCode(p.id,p.id); if (p.sku) addCode(p.sku,p.id);
});
const findCode = c => { const k=norm(c); return CODE[k] || (/^a\d/.test(k)&&CODE[k.slice(1)]) || []; };
const rankIds = ids => ids.map(id=>byId[id]).sort((a,b)=>(!a.stock)-(!b.stock) || (!a.img)-(!b.img) || (a.price??1e9)-(b.price??1e9)).map(p=>p.id);
function parseLine(line){
  const L=line.replace(/\s+/g,' ').trim(), c=[]; let m;
  if ((m=L.match(/^(.+?)(?:\s+|\s*[x×х*]\s*|-)(\d{1,4})\s*(?:ta|dona|шт|sht|pcs)?\.?$/i))) c.push([m[1],+m[2]]);
  if ((m=L.match(/^(\d{1,4})\s*(?:ta|dona|шт|sht|pcs|[x×х*])?\.?\s+(.+)$/i))) c.push([m[2],+m[1]]);
  c.push([L,1]);
  for (const [code,qty] of c){ const ids=findCode(code.trim()); if (ids.length) return {code:code.trim(),qty,ids}; }
  return {code:c[0][0].trim(),qty:c[0][1],ids:[]};
}
function parseLines(txt){
  return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const x=parseLine(line), own=norm(x.code); let ids=rankIds(x.ids);
    if (ids.includes(own)) ids=[own,...ids.filter(i=>i!==own)];  // tovar kodi aniq yozilgan bo'lsa, o'sha tovar birinchi
    return {line, code:x.code, qty:x.qty, ids, pick: ids[0]||null};
  });
}

const SHOP = { phone:'+998505220008', telegram:'', whatsapp:true };
const MSG_MAX = 3900;  // Telegram bitta xabarga 4096 belgigacha oladi
const URL_MAX = 3900;  // t.me 4108 belgidan uzun havolani qaytaradi; kodlangan matn shu chegaradan oshmasin
function orderParts(text){
  const fits=s=>s.length<=MSG_MAX && encodeURIComponent(s).replace(/'/g,'%27').length<=URL_MAX;  // brauzer ' ni %27 qiladi
  if (fits(text)) return [text];
  const L=text.split('\n'), isItem=l=>/^\d+\) /.test(l), first=L.findIndex(isItem); if (first<0) return [text];
  let last=first; L.forEach((l,i)=>{ if(isItem(l)) last=i; });
  const head=L.slice(0,first), items=L.slice(first,last+1), foot=L.slice(last+1);
  // 1-qismda to'liq sarlavha (izoh bilan), keyingilarida faqat nom va mijoz
  const build=(it,i,n,isLast)=>[...(i===0?head:head.slice(0,2)).map((h,j)=>j===0?h+` (${i+1}/${n})`:h), ...(i===0?[]:['']), ...it, ...(isLast?foot:[])].join('\n');
  const parts=[]; let cur=[];
  items.forEach(l=>{ if (cur.length && !fits(build(cur.concat(l),parts.length,99,true))) { parts.push(cur); cur=[]; } cur.push(l); });
  parts.push(cur);
  return parts.map((it,i)=>build(it,i,parts.length,i===parts.length-1));
}

    qr.onclick=run; $('#qoClear').onclick=()=>{ state.quickText=''; state.quick=null; render(); };
    document.querySelectorAll('[data-qpick]').forEach(el=>el.onchange=()=>{ state.quick[+el.dataset.qpick].pick=el.value; });
    document.querySelectorAll('[data-qqty]').forEach(el=>el.onchange=()=>{ state.quick[+el.dataset.qqty].qty=Math.max(0,parseInt(el.value)||0); state.quickText=$('#qoText').value; render(); });
    const qa=$('#qoAdd'); if (qa) qa.onclick=()=>{ let n=0; state.quick.forEach(x=>{ if(x.pick && x.qty>0){ addToCart(x.pick,x.qty); n++; } }); saveCart(); toast(`Savatga qo'shildi: ${n} ta pozitsiya`); go('cart'); };
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.back) goBack();
  else if (d.open) go('product',{id:d.open});
  else if (d.add){ addToCart(d.add,1); saveCart(); toast("Savatga qo'shildi"); const sy=scrollY; render(); scrollTo(0,sy); }
  else if (d.car!==undefined && t.closest('.carpick,.sec-head')) { if (t.closest('.carpick')) setMyCar(d.car); go('catalog',{car:d.car,cat:'',brand:'',q:''}); }
  else if (d.cat!==undefined && (t.classList.contains('cat')||t.closest('.crumbs,.catbar'))) go('catalog',{cat:d.cat,car:myCar,brand:'',q:''});
  else if (d.go) go(d.go, d.go==='catalog'&&t.closest('.sec-head,.empty')?{car:myCar,cat:'',brand:'',q:''}:{});
  else if (d.widen){ state.car=''; state.limit=24; render(); }
  else if (d.fclose){ state.fopen=false; render(); $('.toolbar')?.scrollIntoView({block:'start'}); }
  else if (d.clear){ if(d.clear==='all') Object.assign(state,{car:'',cat:'',brand:'',q:'',stock:false,photo:false}); else state[d.clear]=''; if(d.clear==='car'||d.clear==='all') setMyCar(''); if(d.clear==='q'||d.clear==='all') $('#q').value=''; render(); }
  else if (d.inc){ cart[d.inc]++; saveCart(); render(); }
  else if (d.dec){ cart[d.dec]--; if(cart[d.dec]<=0) delete cart[d.dec]; saveCart(); render(); }
  else if (d.rm){ delete cart[d.rm]; saveCart(); render(); }
  else if (d.copyOrder){ const ta=$('#ordText'); const txt=ta.value; (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('Nusxalandi'),()=>{ ta.select(); toast('Matnni belgilab, nusxalang'); }); }
  else if (d.copyLink){ const txt=location.href; (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('Havola nusxalandi'),()=>toast(txt)); }
  else if (d.copy){ const txt=d.copy; (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('OEM nusxalandi'),()=>toast(txt)); }
});
$('#logo').onclick = () => go('home');
// Admin paneldan o'zgartiriladigan sozlamalar (config.json); yuklanmasa yuqoridagi qiymatlar qoladi
function applyShop(){
  const d=String(SHOP.phone||'').replace(/\D/g,'');
  $('#shopContact').innerHTML = d ? `Buyurtma: <a href="tel:+${d}">+${d.replace(/^(998)(\d\d)(\d{3})(\d\d)(\d\d)$/,'$1 $2 $3 $4 $5')}</a>` : '';
  if (typeof SHOP.banner==='string') { $('#banner').textContent=SHOP.banner; $('#banner').hidden=!SHOP.banner.trim(); }
}
applyShop();
fetch('config.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(c=>{ if(!c) return;
  ['phone','telegram','banner'].forEach(k=>{ if (typeof c[k]==='string') SHOP[k]=c[k]; }); if (typeof c.whatsapp==='boolean') SHOP.whatsapp=c.whatsapp; applyShop(); if (state.view==='done') render(); }).catch(()=>{});
$('#cartTop').onclick = () => go('cart');
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt=setTimeout(()=>{ state.q=e.target.value; if(state.view!=='catalog'){ Object.assign(state,{car:myCar,cat:'',brand:''}); go('catalog'); } else { state.limit=24; render(); $('#q').focus(); } },250); });
try { if (history.state && history.state.view) Object.assign(state, history.state); else if (location.hash) Object.assign(state, fromUrl()); } catch(e) {}
updCount(); render();
</script>
